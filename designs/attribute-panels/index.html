<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>五行奇谈 · 人物与宝宝属性</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <!-- Context: Five Elements game art, reference screenshots supplied 2026-09-09.
       Native text and controls over existing v7 skins; example data, local prototype. -->
  <main id="stage" data-screen-label="人物与宝宝属性面板">
    <div class="scenery" aria-hidden="true"></div>
    <div class="scene-shade" aria-hidden="true"></div>
    <div class="game-brand"><img src="assets/round_badge_taiji.png" alt=""><span>五行奇谈</span><i></i><small>天墉城</small></div>
    <div class="scene-position">青山有道 · 万物有灵</div>
    <section class="panel" id="panel" aria-label="属性面板">
      <header class="panel-header">
        <nav class="entity-tabs" aria-label="查看对象">
          <button type="button" data-mode="hero" class="entity-tab active" aria-pressed="true">人物</button>
          <button type="button" data-mode="pet" class="entity-tab" aria-pressed="false">宝宝</button>
        </nav>
        <div class="title-plaque"><img src="assets/round_badge_taiji.png" alt=""><h1 id="panelTitle">人物属性</h1></div>
        <button type="button" class="close-button" id="closePanel" aria-label="关闭属性面板">×</button>
      </header>
      <div class="panel-body">
        <aside class="identity-column" id="identity"></aside>
        <section class="details-column">
          <div class="section-heading"><h2>属性总览</h2><span id="entitySummary">道童 · 85级</span></div>
          <div class="stats-grid" id="stats"></div>
          <div class="detail-decoration" aria-hidden="true"><span></span><img src="assets/round_badge_taiji.png" alt=""><span></span></div>
          <div id="entityExtra"></div>
        </section>
        <section class="allocation-column" aria-label="属性加点">
          <div class="allocation-heading"><div><span class="eyebrow">修行有道</span><h2>属性加点</h2></div><label class="scheme-label">加点方案<select id="scheme"><option value="strength">力道流</option><option value="spirit">灵法流</option><option value="speed">敏捷流</option><option value="balanced">均衡流</option></select></label></div>
          <div class="point-summary"><div><span class="point-gem" aria-hidden="true">◆</span><span>剩余属性点</span></div><strong id="remaining">20</strong><span class="pending" id="pending">待分配</span></div>
          <div class="allocation-rows" id="allocations"></div>
          <div class="allocation-tip"><span aria-hidden="true">◇</span><p id="allocationTip">分配后点击确认，才会保存本次加点</p></div>
          <div class="allocation-actions"><button type="button" class="button secondary" id="reset">重置</button><button type="button" class="button secondary" id="auto">自动加点</button><button type="button" class="button primary" id="confirm">确认加点</button></div>
        </section>
      </div>
      <footer class="panel-footer"><div class="footer-copy"><span class="seal">道</span><span id="footerText">一念入道，五行随心</span></div><button type="button" class="text-button" id="help">加点说明 <span aria-hidden="true">?</span></button><span class="footer-mark">五 行 奇 谈</span></footer>
    </section>
    <div class="reopen" id="reopen" hidden><button class="button primary" data-open="hero">人物属性</button><button class="button primary" data-open="pet">宝宝属性</button></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>
  <dialog id="infoDialog" aria-labelledby="dialogTitle"><form method="dialog"><button class="dialog-close" aria-label="关闭说明">×</button><h2 id="dialogTitle">加点说明</h2><div id="dialogBody"></div><button class="button primary">知道了</button></form></dialog>
  <script src="model.js"></script>
  <script src="app.js"></script>
</body>
</html>
