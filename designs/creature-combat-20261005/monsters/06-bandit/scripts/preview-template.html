<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>山贼 · 六组战斗动作检查</title>
<style>
:root{color-scheme:dark;font:16px/1.5 system-ui,sans-serif;background:#18221f;color:#f1eee2}*{box-sizing:border-box}body{margin:0;padding:24px;max-width:1500px;margin-inline:auto}h1{font-size:28px;margin:0}p{color:#bbc7bf}nav,button,select,input{font:inherit}button,select{background:#30483e;color:inherit;border:1px solid #66806d;border-radius:7px;padding:7px 12px;cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #e8c576}nav,.controls{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.layout{display:grid;grid-template-columns:minmax(300px,700px) 1fr;gap:24px}.stage{aspect-ratio:1;position:relative;overflow:hidden;background-color:#e6e5dd;background-image:linear-gradient(45deg,#cdcec6 25%,transparent 25%),linear-gradient(-45deg,#cdcec6 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#cdcec6 75%),linear-gradient(-45deg,transparent 75%,#cdcec6 75%);background-size:32px 32px;background-position:0 0,0 16px,16px -16px,-16px 0;border-radius:10px}.stage img{width:100%;height:100%;object-fit:contain;position:absolute;inset:0;image-rendering:auto}.pivot{position:absolute;left:50%;top:91.9921875%;width:16px;height:16px;border:1px solid #ed485b;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}.details{white-space:pre-wrap;overflow-wrap:anywhere;color:#c8d7ce;font-size:13px}.frames{display:grid;grid-template-columns:repeat(auto-fill,minmax(106px,1fr));gap:8px;margin-top:20px}.thumb{padding:4px;background:#cad0c6;color:#17251d}.thumb img{display:block;width:100%;aspect-ratio:1;object-fit:contain}.thumb.active{outline:3px solid #eec15b}.notice{color:#e8c576}input[type=range]{width:100%}.loupe{height:200px;width:100%;background-repeat:no-repeat;background-color:#cad0c6;border-radius:8px;image-rendering:auto}.hidden{display:none}@media(max-width:800px){body{padding:14px}.layout{grid-template-columns:1fr}}
</style>
<h1>山贼 · 受击 / 普攻 / 施法</h1>
<p>E 敌方斜前朝右下；W 我方斜后朝左上。检查解剖左右、持刀手、胸背、脚底承重及收势。预览不代表客户端验收。</p>
<nav id="groups"></nav><p id="completion" class="notice"></p>
<div class="layout"><section><div id="stage" class="stage"><img id="sprite" alt="当前动作帧"><span id="pivot" class="pivot"></span></div>
<div class="controls"><button id="play">播放</button><button id="prev">上一帧</button><button id="next">下一帧</button><button id="reset">首帧</button><select id="speed" aria-label="播放速度"><option value="1">正常 1×</option><option value="0.25">慢放 0.25×</option></select><select id="background" aria-label="检查背景"><option value="checker">棋盘透明</option><option value="#141719">深色背景</option><option value="#ffffff">白色背景</option><option value="#7d9380">灰绿背景</option></select><label><input id="showPivot" type="checkbox" checked>锚点</label></div>
<input id="scrub" type="range" min="0" value="0" step="1" aria-label="逐帧"><p id="label"></p></section>
<aside><p>鼠标移到大图可检查手足与边缘（下方显示原生 1:1 像素局部）。方向与动作按钮不自动宣告视觉通过。</p><div id="loupe" class="loupe"></div><pre id="details" class="details"></pre><p id="loadState"></p></aside></div>
<div id="frames" class="frames"></div>
<script>
const pack=__PACK_DATA__;
const $=id=>document.getElementById(id),names={hit:'受击',attack:'普攻',cast:'施法'};
let current=0,index=0,playing=false,last=0,accumulator=0,loaded=0,failed=0;
const cache=new Map();
for(const g of pack.groups)for(const f of g.frames){const image=new Image();image.onload=()=>{loaded++;loadStatus()};image.onerror=()=>{failed++;loadStatus()};image.src=f.previewSrc;cache.set(f.previewSrc,image)}
function loadStatus(){$('loadState').textContent=`已加载 ${loaded}/${pack.frames.length} 帧；加载失败 ${failed}`}
function group(){return pack.groups[current]}
function display(){const g=group(),f=g.frames[index];$('scrub').max=Math.max(0,g.frames.length-1);$('scrub').value=index;
 if(!f){$('sprite').removeAttribute('src');$('label').textContent='本组尚未落盘';$('details').textContent='';return}
 $('sprite').src=f.previewSrc;$('label').textContent=`${names[g.action]} · ${g.direction} · ${String(f.frame).padStart(2,'0')} / ${g.expectedFrames} · 每帧 ${g.durationMs} ms · 当前 ${$('speed').value}×`;
 $('details').textContent=JSON.stringify({file:f.file,pivot:f.pivot,event:f.event,pose:f.pose,alphaBoundingBox:f.alphaBoundingBox,visualStatus:f.visualStatus,generation:f.generation,sha256:f.sha256},null,2);
 document.querySelectorAll('.thumb').forEach((b,i)=>b.classList.toggle('active',i===index));$('loupe').style.backgroundImage=`url("${f.previewSrc}")`;
}
function choose(n){current=n;index=0;accumulator=0;playing=false;$('play').textContent='播放';const g=group();$('frames').replaceChildren();g.frames.forEach((f,i)=>{const b=document.createElement('button');b.className='thumb';b.title=f.file;const im=document.createElement('img');im.src=f.previewSrc;im.alt=`${names[g.action]} ${g.direction} 第 ${f.frame} 帧`;b.append(im,document.createTextNode(String(f.frame).padStart(2,'0')));b.onclick=()=>{pause();index=i;display()};$('frames').append(b)});display()}
function pause(){playing=false;$('play').textContent='播放';accumulator=0}
for(const [n,g]of pack.groups.entries()){const b=document.createElement('button');b.textContent=`${names[g.action]} ${g.direction} (${g.frames.length}/${g.expectedFrames})`;b.onclick=()=>choose(n);$('groups').append(b)}
$('completion').textContent=`已落盘 ${pack.frames.length}/68 帧；技术检查：${pack.technicalStatus}。客户端尚未验收。`;
$('play').onclick=()=>{if(!group().frames.length)return;playing=!playing;$('play').textContent=playing?'暂停':'播放';accumulator=0};
$('prev').onclick=()=>{pause();index=(index-1+group().frames.length)%Math.max(1,group().frames.length);display()};
$('next').onclick=()=>{pause();index=(index+1)%Math.max(1,group().frames.length);display()};
$('reset').onclick=()=>{pause();index=0;display()};$('scrub').oninput=e=>{pause();index=Number(e.target.value);display()};$('speed').onchange=()=>{accumulator=0;display()};
$('background').onchange=e=>{$('stage').style.backgroundImage=e.target.value==='checker'?'': 'none';$('stage').style.backgroundColor=e.target.value==='checker'?'':e.target.value};
$('showPivot').onchange=e=>$('pivot').classList.toggle('hidden',!e.target.checked);
$('stage').onpointermove=e=>{const r=e.currentTarget.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*1024,y=(e.clientY-r.top)/r.height*1024;$('loupe').style.backgroundPosition=`${$('loupe').clientWidth/2-x}px ${100-y}px`};
document.addEventListener('keydown',e=>{if(['INPUT','SELECT'].includes(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();$('play').click()}if(e.code==='ArrowLeft')$('prev').click();if(e.code==='ArrowRight')$('next').click()});
function tick(t){const delta=last?Math.min(t-last,1000):0;last=t;if(playing&&group().frames.length){accumulator+=delta*Number($('speed').value);if(accumulator>=group().durationMs){const steps=Math.floor(accumulator/group().durationMs);accumulator%=group().durationMs;index=(index+steps)%group().frames.length;display()}}requestAnimationFrame(tick)}
choose(0);loadStatus();requestAnimationFrame(tick);
</script></html>
