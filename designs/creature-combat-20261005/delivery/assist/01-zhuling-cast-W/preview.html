<!doctype html><meta charset="utf-8"><title>烛翎 W 施法末段候选</title>
<style>body{background:#e9e8de;color:#233c32;font:16px system-ui;max-width:950px;margin:20px auto}canvas{width:min(76vw,640px);height:auto;background:repeating-conic-gradient(#e6e5df 0 25%,#fffdf5 0 50%) 0/30px 30px}button,input{margin:5px;padding:8px}small{display:block}p{max-width:780px}</style>
<h1>烛翎 W 施法末段候选</h1><p>原W12 → 候选13 → 原W14 → 候选15 → 候选16 → 原W01。仅辅助检视；最终六组验收由原窗口完成。</p><canvas id="view" width="1024" height="1024"></canvas><p id="label"></p>
<button id="toggle">播放</button><button id="prev">上一帧</button><button id="next">下一帧</button><button id="normal">45ms</button><button id="slow">0.25倍</button><input id="slider" type="range" min="0" max="5" value="0"><small>候选原生1254整图仅在预览中缩至820并置于(102,102)；原正式图按原1024画布显示，PNG未修改。</small>
<script>
const frames=[['原W12','../../../pets/01-zhuling/runtime/cast/W/12.png',false],['候选W13','13.png',true],['原W14','../../../pets/01-zhuling/runtime/cast/W/14.png',false],['候选W15','15.png',true],['候选W16','16.png',true],['原W01','../../../pets/01-zhuling/runtime/cast/W/01.png',false]];
const c=document.querySelector('#view'),ctx=c.getContext('2d'),s=document.querySelector('#slider'),label=document.querySelector('#label');let index=0,ms=45,playing=false,last=0;
Promise.all(frames.map(f=>new Promise((resolve,reject)=>{f[3]=new Image();f[3].onload=resolve;f[3].onerror=reject;f[3].src=f[1]}))).then(()=>{draw();requestAnimationFrame(tick)}).catch(()=>label.textContent='图片载入失败，请检查相对路径');
function draw(){const f=frames[index];ctx.clearRect(0,0,1024,1024);f[2]?ctx.drawImage(f[3],102,102,820,820):ctx.drawImage(f[3],0,0,1024,1024);label.textContent=f[0]+' · '+ms+'ms';s.value=index}
function step(d){playing=false;index=(index+d+frames.length)%frames.length;draw()}
function tick(t){if(playing&&t-last>=ms){index=(index+1)%frames.length;draw();last=t}requestAnimationFrame(tick)}
document.querySelector('#toggle').onclick=()=>playing=!playing;document.querySelector('#prev').onclick=()=>step(-1);document.querySelector('#next').onclick=()=>step(1);document.querySelector('#normal').onclick=()=>{ms=45;draw()};document.querySelector('#slow').onclick=()=>{ms=180;draw()};s.oninput=()=>{playing=false;index=+s.value;draw()};
</script>
