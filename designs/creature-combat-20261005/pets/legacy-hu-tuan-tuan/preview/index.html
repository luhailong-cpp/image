const labels={hit:'受击',attack:'普攻',cast:'施法'};
const state=[];let speed=1;let allPlaying=false;
const issue=document.querySelector('#issues');const v=report.verification;
issue.textContent=`正式帧 ${v.presentFrames} / ${v.expectedFrames}；技术检查 ${v.technicalPassed?'通过':'未通过'}；错误 ${v.errors.length}；提示 ${v.warnings.length}。视觉和连播状态：待人工检查。`;
if(v.errors.length||v.warnings.length){const d=document.createElement('details');const s=document.createElement('summary');s.textContent='查看技术检查明细';d.append(s);const ul=document.createElement('ul');for(const value of [...v.errors,...v.warnings]){const li=document.createElement('li');li.textContent=value;ul.append(li)}d.append(ul);issue.append(d)}
function render(st){const f=st.frames[st.index];st.image.hidden=!f.exists;st.missing.hidden=f.exists;st.image.src=f.exists?'../'+f.file:'';st.counter.textContent=`${st.index+1} / ${st.frames.length}`;st.slider.value=st.index;st.filename.textContent=f.file;st.play.textContent=st.playing?'暂停':'播放';st.frameStarted=performance.now()}
function setPlaying(st,on){st.playing=on;st.frameStarted=performance.now();st.play.textContent=on?'暂停':'播放'}
for(const action of ['hit','attack','cast'])for(const direction of ['E','W']){
 const frames=report.frames.filter(f=>f.action===action&&f.direction===direction);const card=document.createElement('section');card.className='card';
 card.innerHTML=`<div class="head"><strong>${labels[action]} · ${direction}</strong><span>${frames.length} 帧 × ${frames[0].durationMs} ms</span></div><div class="stage"><img alt="${action} ${direction} 当前帧"><div class="missing">缺少正式帧</div><div class="anchor"></div></div><div class="controls"><div class="row"><button class="prev">上一帧</button><button class="play">播放</button><button class="next">下一帧</button><span class="counter"></span></div><input type="range" min="0" max="${frames.length-1}" value="0" step="1" aria-label="逐帧滑块"><div><code class="filename"></code></div><div class="drop"></div><a href="contact-${action}-${direction}.png">打开全帧接触表</a></div>`;
 document.querySelector('#grid').append(card);const st={frames,index:0,playing:false,image:card.querySelector('img'),missing:card.querySelector('.missing'),counter:card.querySelector('.counter'),slider:card.querySelector('input'),filename:card.querySelector('.filename'),play:card.querySelector('.play'),frameStarted:0,drop:card.querySelector('.drop'),delays:0};state.push(st);
 st.play.onclick=()=>setPlaying(st,!st.playing);card.querySelector('.prev').onclick=()=>{setPlaying(st,false);st.index=(st.index+frames.length-1)%frames.length;render(st)};card.querySelector('.next').onclick=()=>{setPlaying(st,false);st.index=(st.index+1)%frames.length;render(st)};st.slider.oninput=()=>{setPlaying(st,false);st.index=Number(st.slider.value);render(st)};render(st);
 for(const f of frames.filter(f=>f.exists)){const img=new Image();img.src='../'+f.file}
 const figure=document.createElement('figure');figure.innerHTML=`<figcaption>${labels[action]} · ${direction}</figcaption><a href="contact-${action}-${direction}.png"><img loading="lazy" alt="${action} ${direction} 全部帧" src="contact-${action}-${direction}.png"></a>`;document.querySelector('#sheets').append(figure)
}
document.querySelector('#all').onclick=()=>{allPlaying=!allPlaying;state.forEach(st=>setPlaying(st,allPlaying));document.querySelector('#all').textContent=allPlaying?'全部暂停':'全部播放'};
document.querySelector('#reset').onclick=()=>state.forEach(st=>{setPlaying(st,false);st.index=0;st.delays=0;st.drop.textContent='';render(st)});
document.querySelector('#speed').onchange=e=>{speed=Number(e.target.value);state.forEach(st=>st.frameStarted=performance.now())};
document.querySelector('#anchors').onchange=e=>document.querySelectorAll('.anchor').forEach(el=>el.hidden=!e.target.checked);
// Keep every pose visible, never interpolate or omit frames. When the browser
// cannot maintain cadence, report delay instead of claiming accurate playback.
function tick(now){for(const st of state){if(!st.playing)continue;const duration=st.frames[st.index].durationMs/speed;const elapsed=now-st.frameStarted;if(elapsed>=duration){const lateness=elapsed-duration;if(lateness>20){st.delays++;st.drop.textContent=`浏览器计时延迟 ${st.delays} 次，建议单组或慢速复查`}st.index=(st.index+1)%st.frames.length;const prior=st.frameStarted;render(st);st.frameStarted=lateness>duration?now:prior+duration}}requestAnimationFrame(tick)}requestAnimationFrame(tick);
document.addEventListener('visibilitychange',()=>{if(document.hidden){state.forEach(st=>setPlaying(st,false));allPlaying=false;document.querySelector('#all').textContent='全部播放'}});
