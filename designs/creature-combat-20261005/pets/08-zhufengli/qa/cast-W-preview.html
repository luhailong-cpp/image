<!doctype html><meta charset="utf-8"><title>竹风狸 W 施法16帧 QA</title><style>body{background:#19372e;color:#fff;font:16px system-ui}canvas{background:#293e44;width:min(80vh,90vw);display:block}button,select,input{font:inherit;margin:8px;padding:8px}output{display:block}</style><h1>竹风狸 W 施法 · 16×45ms</h1><button id="play">播放</button><button id="prev">上一帧</button><button id="next">下一帧</button><select id="rate"><option value="1">正常 1×</option><option value="0.25">慢放 0.25×</option></select><input id="frame" type="range" min="1" max="16" value="1"><output id="info"></output><canvas width="1024" height="1024"></canvas><script>
const cvs=document.querySelector('canvas'),ctx=cvs.getContext('2d'),imgs=[],audit=[];let frame=0,playing=false,rate=1,base=0;const ready=Promise.all(Array.from({length:16},(_,i)=>new Promise(resolve=>{let im=new Image;im.onload=()=>{imgs[i]=im;resolve()};im.src='../runtime/cast/W/'+String(i+1).padStart(2,'0')+'.png?v=castWfinal';})));function paint(){ctx.clearRect(0,0,1024,1024);ctx.drawImage(imgs[frame],0,0);document.querySelector('#frame').value=frame+1;document.querySelector('#info').textContent='W cast '+(frame+1)+'/16 · 45 ms · '+rate+'×';audit.push({frame:frame+1,rate,at:performance.now()});if(audit.length>800)audit.shift();}ready.then(paint);document.querySelector('#play').onclick=()=>{playing=!playing;base=performance.now()-frame*45/rate;document.querySelector('#play').textContent=playing?'暂停':'播放'};document.querySelector('#rate').onchange=e=>{rate=+e.target.value;base=performance.now()-frame*45/rate;paint()};document.querySelector('#frame').oninput=e=>{playing=false;frame=+e.target.value-1;paint()};document.querySelector('#prev').onclick=()=>{playing=false;frame=(frame+15)%16;paint()};document.querySelector('#next').onclick=()=>{playing=false;frame=(frame+1)%16;paint()};function tick(now){if(playing&&imgs.length===16){let n=Math.floor((now-base)*rate/45)%16;if(n!==frame){frame=n;paint()}}requestAnimationFrame(tick)}requestAnimationFrame(tick);window.castWQA=()=>({loaded:imgs.length,frame:frame+1,playing,rate,audit});
</script>
