<!doctype html><html lang="zh"><meta charset="utf-8"><title>岚铎仙普攻动作预览</title><style>body{background:#cbd5dd;color:#142634;font:18px system-ui;text-align:center}img{width:640px;height:640px;object-fit:contain}button,select,input{font:inherit;margin:5px}</style><h1>岚铎仙 · 普攻</h1><div><select id="dir"><option>E</option><option>W</option></select><button id="play">暂停</button><select id="speed"><option value="1">正常 30ms</option><option value="0.25">0.25 慢放</option></select><input id="frame" type="range" min="1" max="12" value="1"><span id="label"></span></div><img id="sprite"><script>const s=document.getElementById('sprite'),f=document.getElementById('frame'),l=document.getElementById('label');let n=1,playing=true,last=0;function show(){s.src='../../runtime/attack/'+dir.value+'/'+String(n).padStart(2,'0')+'.png';f.value=n;l.textContent=dir.value+' '+n+'/12'}frame.oninput=()=>{playing=false;play.textContent='播放';n=+f.value;show()};play.onclick=()=>{playing=!playing;play.textContent=playing?'暂停':'播放'};dir.onchange=()=>{n=1;show()};function tick(t){if(playing&&t-last>=30/+speed.value){n=n%12+1;show();last=t}requestAnimationFrame(tick)}show();requestAnimationFrame(tick)</script></html>
