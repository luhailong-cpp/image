<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>原版道家Q角色 · V14 HD实绘行走审阅</title><style>*{box-sizing:border-box}body{margin:0;background:#1d2c30;color:#edf0e5;font:16px/1.5 system-ui,"Microsoft YaHei",sans-serif}main{max-width:2140px;margin:auto;padding:24px}h1{font-size:25px;margin:0 0 8px}p{color:#b6c8c5}.bar{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0;align-items:center}button,select{font:inherit;color:inherit;background:#314b51;border:1px solid #5e7779;border-radius:5px;padding:8px 12px}.panes{display:grid;grid-template-columns:1fr 1fr;gap:18px}.pane{text-align:center;background:#2b4045;padding:14px;border-radius:8px}canvas{width:100%;max-width:1024px;aspect-ratio:1;background:repeating-conic-gradient(#40565b 0% 25%,#374c51 0% 50%) 50%/24px 24px}h2{font-size:18px;margin:0 0 10px}.status{color:#f0c782}.normal .panes{max-width:680px}.normal canvas{max-width:300px}.muted{font:14px ui-monospace,monospace;color:#bdd1cb}label{display:flex;align-items:center;gap:6px}@media(max-width:560px){main{padding:14px}.panes{gap:8px}.pane{padding:8px}button,select{padding:6px 8px}h1{font-size:21px}}</style><body class="normal"><main><h1>原版道家Q角色 · 八方向16帧</h1><p>直接播放实际透明PNG；每帧30毫秒，完整周期480毫秒。原生格至少1024；交付1024帧。普通尺寸300px；放大后可在宽屏检查原生细节。素材与视觉验收状态分开显示。</p><div class="bar"><select id="character" aria-label="角色"></select><select id="direction" aria-label="方向"><option>S</option><option>E</option><option>SE</option><option>NE</option><option>N</option><option>NW</option><option>W</option><option>SW</option></select><button id="play">暂停</button><button id="prev">上一帧</button><button id="next">下一帧</button><select id="speed" aria-label="速度"><option value="1">正常</option><option value=".5">半速</option><option value=".25">四分之一</option></select><label><input id="large" type="checkbox">放大</label><span id="phase" class="muted"></span></div><p id="status" class="status">正在读取候选目录…</p><div class="panes"><div class="pane"><h2>独立站立</h2><canvas id="idle" width="1024" height="1024"></canvas></div><div class="pane"><h2>真实行走 · 16 × 30 ms</h2><canvas id="walk" width="1024" height="1024"></canvas></div></div><p class="muted">检查接触01/09、左右承重、摆臂、人物比例、配饰方向以及15→16→01循环。尚未生成的图不会用重复帧填充。</p></main><script>
const $=id=>document.getElementById(id);let inventory=[],images=[],idle=null,phase=0,last=performance.now(),playing=true,speed=1,requestId=0;
async function image(path){let im=new Image;im.src=path;try{await im.decode();return im}catch{return null}}
async function select(){const token=++requestId;images=[];idle=null;const c=$('character').value,d=$('direction').value,base=`candidate/${c}/`;$('status').textContent=`${c} / ${d} · 正在读取实际帧`;const [frames,standing]=await Promise.all([Promise.all(Array.from({length:16},(_,i)=>image(`${base}walk/${d}/${String(i+1).padStart(2,'0')}.png`))),image(`${base}idle/${d}.png`)]);if(token!==requestId)return;images=frames;idle=standing;const entry=inventory.find(x=>x.id===c);$('status').textContent=`${c} / ${d} · ${frames.filter(Boolean).length}/16帧 · idle ${standing?'已就绪':'待生成'} · ${entry?.status||'未验收'}`;draw()}
function paint(canvas,im,label){const ctx=canvas.getContext('2d');ctx.clearRect(0,0,1024,1024);if(im)ctx.drawImage(im,0,0);else{ctx.fillStyle='#f0c782';ctx.textAlign='center';ctx.font=`${Math.max(24,14*1024/Math.max(1,canvas.clientWidth))}px system-ui`;ctx.fillText(label,512,520)}}
function draw(){let index=Math.floor(phase/30)%16;paint($('walk'),images[index],'该帧待生成');paint($('idle'),idle,'独立站立待生成');$('phase').textContent=`${String(index+1).padStart(2,'0')}/16 · ${Math.floor(phase)} /480ms`}
function frame(t){if(playing)phase=(phase+(t-last)*speed)%480;last=t;draw();requestAnimationFrame(frame)}
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'暂停':'播放'};function step(delta){playing=false;$('play').textContent='播放';phase=(Math.floor(phase/30)*30+delta+480)%480;draw()};$('prev').onclick=()=>step(-30);$('next').onclick=()=>step(30);$('speed').onchange=e=>speed=Number(e.target.value);$('large').onchange=e=>document.body.classList.toggle('normal',!e.target.checked);$('character').onchange=select;$('direction').onchange=select;window.previewDebug={getState:()=>({character:$('character').value,direction:$('direction').value,frame:Math.floor(phase/30)+1,phase,loaded:images.filter(Boolean).length,loadedIndices:images.flatMap((im,i)=>im?[i+1]:[]),nativeSizes:images.map(im=>im?[im.naturalWidth,im.naturalHeight]:null),idleLoaded:!!idle,playing,speed}),setPhase:ms=>{playing=false;phase=(ms%480+480)%480;draw()}};
fetch('preview-index.json',{cache:'no-store'}).then(r=>r.json()).then(data=>{inventory=data;for(const c of data){let option=document.createElement('option');option.value=c.id;option.textContent=c.id;$('character').append(option)}if(data.length)select();else $('status').textContent='候选目录尚无素材；等待首张实绘方向图。'});requestAnimationFrame(frame);
</script></body></html>
