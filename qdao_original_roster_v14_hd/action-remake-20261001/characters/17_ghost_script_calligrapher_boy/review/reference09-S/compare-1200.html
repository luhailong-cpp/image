<!doctype html><html lang="zh"><meta charset="utf-8"><title>S方向 09参考 / 17当前 比较</title><style>body{background:#282f33;color:#f0f2f3;font:16px system-ui;margin:28px}button,input{font:inherit}main{display:flex;gap:32px}.card{width:260px;text-align:center}img{width:240px;height:240px}small{display:block;color:#aab8bf;max-width:1200px}button{padding:8px;margin:6px}p{max-width:760px;line-height:1.6}</style><h2>S方向 1200ms 比较</h2><p>左：用户认可的竹弓少女当前图；右：书生当前选图。固定整画布240px显示，不按脚底重新对齐。对齐双腿相位后默认参考偏移8帧。</p><main><div class="card"><h3>09 竹弓少女</h3><img id="ref"><div id="refNo"></div></div><div class="card"><h3>17 灵篆书生</h3><img id="subject"><div id="subjectNo"></div></div></main><p><button id="play">暂停</button><button id="slow">慢放</button><button id="prev">上一帧</button><button id="next">下一帧</button><label>参考相位 <select id="offset"><option value="8">偏移8帧，同侧前导腿</option><option value="0">同帧号</option></select></label></p><p><label>帧 <input id="frame" type="range" min="1" max="16" value="1"></label> <span id="frameLabel"></span></p><small>75ms ×16 =1200ms，无额外相位权重。此页为动作审查，不改变正式资源与验收状态。</small><script>const data={"reference": ["../../../09_bamboo_archer_girl/runtime/run/S/01.png", "../../../09_bamboo_archer_girl/runtime/run/S/02.png", "../../../09_bamboo_archer_girl/runtime/run/S/03.png", "../../../09_bamboo_archer_girl/runtime/run/S/04.png", "../../../09_bamboo_archer_girl/runtime/run/S/05.png", "../../../09_bamboo_archer_girl/runtime/run/S/06.png", "../../../09_bamboo_archer_girl/runtime/run/S/07.png", "../../../09_bamboo_archer_girl/runtime/run/S/08.png", "../../../09_bamboo_archer_girl/runtime/run/S/09.png", "../../../09_bamboo_archer_girl/runtime/run/S/10.png", "../../../09_bamboo_archer_girl/runtime/run/S/11.png", "../../../09_bamboo_archer_girl/runtime/run/S/12.png", "../../../09_bamboo_archer_girl/runtime/run/S/13.png", "../../../09_bamboo_archer_girl/runtime/run/S/14.png", "../../../09_bamboo_archer_girl/runtime/run/S/15.png", "../../../09_bamboo_archer_girl/runtime/run/S/16.png"], "subject": ["../../staging/run-S-01-v1.png", "../../staging/run-S-02-v2.png", "../../staging/run-S-03-v1.png", "../../staging/run-S-04-v4.png", "../../staging/run-S-05-v3.png", "../../staging/run-S-06-v3.png", "../../staging/run-S-07-v6.png", "../../staging/run-S-08-v4.png", "../../staging/run-S-09-v1.png", "../../staging/run-S-10-v2.png", "../../staging/run-S-11-v3.png", "../../staging/run-S-12-v2.png", "../../staging/run-S-13-v3.png", "../../staging/run-S-14-v2.png", "../../staging/run-S-15-v5.png", "../../staging/run-S-16-v3.png"]};let n=0,playing=true,slow=false,last=performance.now();const $=id=>document.getElementById(id);function show(){let r=(n+Number($('offset').value))%16;$('ref').src=data.reference[r];$('subject').src=data.subject[n];$('refNo').textContent='S'+String(r+1).padStart(2,'0');$('subjectNo').textContent='S'+String(n+1).padStart(2,'0');$('frame').value=n+1;$('frameLabel').textContent=(n+1)+'/16'}function stop(){playing=false;$('play').textContent='播放'}$('play').onclick=()=>{playing=!playing;last=performance.now();$('play').textContent=playing?'暂停':'播放'};$('slow').onclick=()=>{slow=!slow;$('slow').textContent=slow?'恢复正常':'慢放';last=performance.now()};$('prev').onclick=()=>{stop();n=(n+15)%16;show()};$('next').onclick=()=>{stop();n=(n+1)%16;show()};$('frame').oninput=()=>{stop();n=Number($('frame').value)-1;show()};$('offset').onchange=show;function tick(t){let frameDuration=slow?150:75;if(playing&&t-last>=frameDuration){let step=Math.floor((t-last)/frameDuration);n=(n+step)%16;last+=frameDuration*step;show()}requestAnimationFrame(tick)}show();requestAnimationFrame(tick);</script></html>
