<!doctype html><html lang="zh"><meta charset="utf-8"><title>S 1200ms 动作复核</title><style>body{font-family:system-ui;background:#dedfdc;color:#222;margin:24px}main{display:flex;gap:32px}img{width:240px;height:240px;object-fit:contain}button{margin:8px;padding:10px}label{display:block} .stage{padding:16px;background:#d3d7d1} #large{width:480px;height:480px}p{max-width:650px}</style><h1>S 连续接地复核</h1><p>16 张独立原生图，正常 1200ms／每帧 75ms。同脚每两帧一个位置，01–08 右脚，09–16 左脚。</p><button id="normal">正常播放</button><button id="slow">慢放</button><button id="pause">暂停</button><button id="step">下一帧</button><label id="state"></label><main><div class="stage"><img id="sprite" alt="S 240px 动画"><div>240px 正常尺寸</div></div><div class="stage"><img id="large" alt="S 放大同步动画"><div>480px 检查尺寸</div></div></main><p>只读预览：原生PNG不移动、不配准、不插帧；慢放仅供观察。支撑脚在纵深中，不能按所有鞋底同一屏幕水平线认定接地。</p><script>const paths=["../staging/run-S-01-v3.png","../staging/run-S-02-v2.png","../staging/run-S-03-v1.png","../staging/run-S-04-v4.png","../staging/run-S-05-v3.png","../staging/run-S-06-v5.png","../staging/run-S-07-v7.png","../staging/run-S-08-v5.png","../staging/run-S-09-v3.png","../staging/run-S-10-v2.png","../staging/run-S-11-v3.png","../staging/run-S-12-v2.png","../staging/run-S-13-v3.png","../staging/run-S-14-v3.png","../staging/run-S-15-v6.png","../staging/run-S-16-v5.png"];let i=0,rate=75,running=true,last=0;const a=document.querySelector('#sprite'),b=document.querySelector('#large'),s=document.querySelector('#state');paths.forEach(p=>{const x=new Image();x.src=p});function show(){a.src=b.src=paths[i];s.textContent=(running?'播放':'暂停')+' · 帧 '+String(i+1).padStart(2,'0')+' / 16 · '+(rate===75?'正常1200ms':'慢放3600ms')+' · '+paths[i]}document.querySelector('#normal').onclick=()=>{rate=75;running=true;last=performance.now();show()};document.querySelector('#slow').onclick=()=>{rate=225;running=true;last=performance.now();show()};document.querySelector('#pause').onclick=()=>{running=false;show()};document.querySelector('#step').onclick=()=>{running=false;i=(i+1)%16;show()};function tick(t){if(running&&t-last>=rate){i=(i+Math.floor((t-last)/rate))%16;last=t;show()}requestAnimationFrame(tick)}show();requestAnimationFrame(tick);</script></html>
