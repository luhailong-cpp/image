<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>冰剑少女 N / NE 跑步复核</title><style>body{font:16px system-ui;margin:32px;background:#e5ebed;color:#16333f}button,select{font:inherit;margin:5px;padding:7px 12px}canvas{display:block;background:repeating-conic-gradient(#cad4d7 0 25%,#dbe3e5 0 50%) 0/24px 24px;border-radius:8px;margin:20px 0}p{max-width:780px;line-height:1.6}</style><h2>冰剑少女 · 北 / 东北</h2><p>16 帧 × 75 毫秒 = 1200 毫秒。逐帧查看同一脚连续承重、每个前后位置的两张不同姿态，再切换支撑脚。</p><select id="dir"><option>N</option><option>NE</option></select><select id="rate"><option value="1">正常 1×</option><option value="0.25">慢放 0.25×</option></select><select id="size"><option>256</option><option>128</option><option>512</option></select><button id="play">暂停</button><button id="prev">上一帧</button><button id="next">下一帧</button><canvas width="256" height="256"></canvas><p id="label"></p><p>浏览器素材预览；未代替客户端实机验收。<a href="all.html">全部动作预览</a></p><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');let images=[],direction='N',index=0,playing=true,start=0,rate=1,loaded=0,last=-1,trace=[];
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);if(images[index]?.complete)ctx.drawImage(images[index],0,0,canvas.width,canvas.height);const foot=direction==='N'?(index<8?'右脚':'左脚'):(index<8?'左脚':'右脚');document.querySelector('#label').textContent=`${direction} · 第 ${index+1} / 16 帧 · ${foot}支撑 · 位置 ${Math.floor(index%8/2)+1} · 75 ms`;}
async function select(d){direction=d;document.querySelector('#dir').value=d;loaded=0;index=0;last=-1;playing=false;images=Array.from({length:16},(_,i)=>{const a=new Image();a.src=`../candidate/run/${d}/${String(i+1).padStart(2,'0')}.png`;return a});await Promise.all(images.map(a=>a.decode()));loaded=16;start=performance.now();playing=true;trace=[];draw();document.querySelector('#play').textContent='暂停'}
function tick(t){if(playing&&loaded===16){index=Math.floor((t-start)*rate/75)%16;if(index!==last){trace.push({frame:index+1,time:t});last=index;draw()}}requestAnimationFrame(tick)}
function step(delta){playing=false;index=(index+delta+16)%16;last=index;document.querySelector('#play').textContent='播放';draw()}
document.querySelector('#dir').onchange=e=>select(e.target.value);document.querySelector('#rate').onchange=e=>{rate=Number(e.target.value);start=performance.now()-index*75/rate};document.querySelector('#size').onchange=e=>{canvas.width=canvas.height=Number(e.target.value);draw()};document.querySelector('#play').onclick=()=>{playing=!playing;start=performance.now()-index*75/rate;last=-1;document.querySelector('#play').textContent=playing?'暂停':'播放'};document.querySelector('#prev').onclick=()=>step(-1);document.querySelector('#next').onclick=()=>step(1);
window.NNE_REVIEW={select,step,getState:()=>({direction,index,loaded,playing,rate,trace:trace.slice()}),restart:()=>{index=0;start=performance.now();last=-1;trace=[];playing=true;draw()}};select('N');requestAnimationFrame(tick);
</script></html>
