<!doctype html><html lang="zh"><meta charset="utf-8"><title>冰剑少女 · 东西跑步接地复核</title><style>body{font:16px system-ui;margin:32px;background:#edf2f3;color:#24343c}main{max-width:900px;margin:auto}button,select{font:inherit;padding:8px;margin:4px;border:1px solid #8fa6af;border-radius:6px;background:white}#stage{background:#c6d4d9;width:256px;height:256px;margin:24px 0;border-radius:8px}#sprite{display:block;width:100%;height:100%;object-fit:contain}#note{max-width:800px;line-height:1.6}small{color:#526872}</style><main><h2>冰剑少女 · 东西跑步接地复核</h2><p>正常 1×：16 帧 × 75 毫秒 = 1.2 秒。可暂停逐帧检查支撑脚与手臂。</p><div><button id="E">东 E</button><button id="W">西 W</button><button id="play">暂停</button><button id="prev">上一帧</button><button id="next">下一帧</button><select id="speed"><option value="1">1×</option><option value=".25">0.25×</option></select><select id="size"><option value="128">128 像素</option><option value="256" selected>256 像素</option><option value="512">512 像素</option></select></div><div id="stage"><img id="sprite"></div><strong id="label"></strong><p id="note"></p><small>整画布播放；图像没有平移贴地、镜像或插帧。此页用于离线素材检查。</small></main><script src="run-EW-position-data.js"></script><script>
const sprite=document.querySelector('#sprite'),stage=document.querySelector('#stage');let dir='E',index=0,playing=false,ready=false,speed=1,t0=performance.now(),last=-1,history=[];
const images={};for(const d of ['E','W'])images[d]=window.EW_DATA[d].frames.map(f=>{let a=new Image;a.src='../candidate/run/'+d+'/'+String(f.frame).padStart(2,'0')+'.png?sha='+f.sha256;return a});
function draw(force=false){if(last===index&&!force)return;last=index;let f=EW_DATA[dir].frames[index];sprite.src=images[dir][index].src;document.querySelector('#label').textContent=dir+' · '+String(index+1).padStart(2,'0')+'/16 · '+f.plannedPhase;document.querySelector('#note').textContent=f.notes;history.push({dir,index:index+1,time:performance.now()});}
function select(d){dir=d;index=0;t0=performance.now();last=-1;history=[];draw(true)}
function step(delta){playing=false;document.querySelector('#play').textContent='播放';index=(index+delta+16)%16;t0=performance.now()-index*75/speed;draw(true)}
function tick(t){if(playing){index=Math.floor((t-t0)*speed/75)%16;draw()}requestAnimationFrame(tick)}
for(const d of ['E','W'])document.querySelector('#'+d).onclick=()=>select(d);
document.querySelector('#play').onclick=()=>{playing=!playing;t0=performance.now()-index*75/speed;document.querySelector('#play').textContent=playing?'暂停':'播放'};
document.querySelector('#prev').onclick=()=>step(-1);document.querySelector('#next').onclick=()=>step(1);
document.querySelector('#speed').onchange=e=>{speed=Number(e.target.value);t0=performance.now()-index*75/speed};
document.querySelector('#size').onchange=e=>{stage.style.width=stage.style.height=e.target.value+'px'};
window.ewReview={select,step,getState:()=>({dir,index:index+1,playing,speed,history:[...history],loaded:ready&&Object.values(images).flat().every(i=>i.complete&&i.naturalWidth===1024)}),play:()=>{playing=ready;index=0;last=-1;t0=performance.now();history=[];draw(true)}};
draw(true);requestAnimationFrame(tick);Promise.all(Object.values(images).flat().map(i=>i.decode())).then(()=>{ready=true;window.ewReview.play()});
</script></html>
