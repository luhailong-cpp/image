<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>冰剑少女·南向动作核对</title><style>body{font:16px system-ui;background:#ecf1f3;color:#193447;margin:28px}button,select{padding:9px;margin:5px;border:1px solid #87a1ad;border-radius:6px;background:white}canvas{display:block;background:#c8d4d9;margin:20px 0;width:256px;height:256px}pre{white-space:pre-wrap;max-width:900px}</style><h1>冰剑少女 · 南向动作核对</h1><p>16 帧 × 75 毫秒，正常一圈 1200 毫秒。透明整画布，无脚底贴线。</p><select id="dir"><option>S</option><option>SE</option><option>SW</option></select><button id="play">暂停</button><button id="prev">上一帧</button><button id="next">下一帧</button><select id="speed"><option value="1">1 倍</option><option value="0.25">0.25 倍</option></select><select id="size"><option>128</option><option selected>256</option><option>512</option></select><canvas id="sprite" width="256" height="256"></canvas><p id="frame"></p><pre id="note"></pre><script src="south-sequences.js"></script><script>
const canvas=document.getElementById('sprite'),ctx=canvas.getContext('2d');let direction='S',index=0,playing=true,speed=1,loaded=false,start=0,lastDraw=-1,generation=0,images=[],events=[];
function draw(t=performance.now()){if(!loaded)return;if(lastDraw===index)return;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(images[index],0,0,canvas.width,canvas.height);lastDraw=index;const s=SOUTH_SEQUENCES[direction];document.getElementById('frame').textContent=`${direction} ${String(index+1).padStart(2,'0')} / 16 · 75 ms`;document.getElementById('note').textContent=s.frames[index].notes;events.push({direction,frame:index+1,time:t});if(events.length>1000)events.shift();}
async function select(d){direction=d;loaded=false;let g=++generation;images=await Promise.all(SOUTH_SEQUENCES[d].frames.map(f=>new Promise((res,rej)=>{let im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src='../'+f.candidatePath;})));if(g!==generation)return;index=0;lastDraw=-1;start=performance.now();loaded=true;events=[];draw();}
function step(delta){playing=false;document.getElementById('play').textContent='播放';index=(index+delta+16)%16;lastDraw=-1;draw();}
function tick(t){if(loaded&&playing){index=Math.floor((t-start)*speed/75)%16;draw(t);}requestAnimationFrame(tick)}
document.getElementById('dir').onchange=e=>select(e.target.value);document.getElementById('play').onclick=()=>{playing=!playing;start=performance.now()-index*75/speed;document.getElementById('play').textContent=playing?'暂停':'播放'};document.getElementById('prev').onclick=()=>step(-1);document.getElementById('next').onclick=()=>step(1);document.getElementById('speed').onchange=e=>{speed=Number(e.target.value);start=performance.now()-index*75/speed};document.getElementById('size').onchange=e=>{canvas.width=canvas.height=Number(e.target.value);canvas.style.width=canvas.style.height=e.target.value+'px';lastDraw=-1;draw()};
window.southReview={select,step,play(){playing=true;index=0;start=performance.now();lastDraw=-1;events=[];},getState(){return{direction,index,loaded,playing,speed,events:[...events]}},snapshot(){return canvas.toDataURL('image/png')}};select('S');requestAnimationFrame(tick);
</script></html>
