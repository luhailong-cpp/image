<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>04 山岳守卫 · 竹弓少女同向对照</title>
<style>body{margin:24px auto;max-width:1120px;padding:0 20px;background:#14201c;color:#e8eee8;font-family:system-ui,"Microsoft YaHei",sans-serif}h1{font-size:25px}p{line-height:1.6;color:#c9d5cc}button,select,input{font:inherit;padding:8px;background:#294134;color:inherit;border:1px solid #7c8d78;border-radius:5px}label{margin-right:14px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:20px 0}figure{margin:0}img{width:100%;max-width:512px;background:#f5f0e2;border-radius:8px}figcaption{padding:8px}a{color:#e6d498}@media(max-width:600px){.pair{gap:8px}}</style>
<h1>山岳守卫 · 竹弓少女同向对照</h1>
<p>右侧为用户新指定的竹弓少女参照。比较鞋尖、膝踝、承重与手部动作；保留山岳守卫自己的金杖、圆盾和持手。本页两侧跑步统一为最新要求的1200ms，同帧号未必代表同一动作相位。</p>
<label>动作方向 <select id="sequence"></select></label><label>速度 <select id="speed"><option value="1">1×</option><option value="0.25">0.25×</option></select></label><button id="play">暂停</button><button id="reset">从头播放</button>
<div class="pair"><figure><figcaption>04 山岳守卫 <span id="left-time"></span></figcaption><img id="left" alt="山岳守卫当前动作"><label>独立逐帧 <input id="left-frame" aria-label="山岳守卫帧号" type="range" min="1" max="16" value="1"></label></figure><figure><figcaption>09 竹弓少女 <span id="right-time"></span></figcaption><img id="right" alt="竹弓少女同向参照"><label>独立逐帧 <input id="right-frame" aria-label="竹弓少女帧号" type="range" min="1" max="16" value="1"></label></figure></div>
<p>跑步均为1200ms一圈，16帧均匀75ms；两侧均可独立逐帧和慢放。本页只读竹弓少女图片，没有修改她的文件。客户端世界位移与滑步尚未在本角色验证。</p><p><a href="index.html">山岳守卫逐帧预览</a> · <a href="gallery.html">山岳守卫动画总览</a></p>
<script src="bamboo-reference-data.js"></script><script>
const el=id=>document.getElementById(id);let selected=referenceSequences.find(x=>x.key==='run/S'),playing=true,elapsed=0,last=0;const counters={left:0,right:0};
for(const s of referenceSequences){const o=document.createElement('option');o.value=s.key;o.textContent=s.key;el('sequence').append(o)}el('sequence').value=selected.key;
function render(side,index){counters[side]=index;el(side).src=selected[side][index];el(side+'-frame').value=index+1;const ds=selected[side==='left'?'durationsLeft':'durationsRight'];el(side+'-time').textContent=`${index+1}/${ds.length}帧 · ${ds[index]}ms · 总${ds.reduce((a,b)=>a+b,0)}ms`;}
function draw(){for(const side of ['left','right']){const ds=selected[side==='left'?'durationsLeft':'durationsRight'];let t=elapsed%ds.reduce((a,b)=>a+b,0),i=0;while(i<ds.length-1&&t>=ds[i])t-=ds[i++];if(i!==counters[side])render(side,i)}}
function reset(){elapsed=0;for(const side of ['left','right']){el(side+'-frame').max=selected[side].length;render(side,0)}}
el('sequence').onchange=()=>{selected=referenceSequences.find(x=>x.key===el('sequence').value);reset()};el('play').onclick=()=>{playing=!playing;el('play').textContent=playing?'暂停':'播放'};el('reset').onclick=()=>{reset();playing=true;el('play').textContent='暂停'};
for(const side of ['left','right'])el(side+'-frame').oninput=()=>{playing=false;el('play').textContent='播放';render(side,Number(el(side+'-frame').value)-1)};
function tick(now){if(last&&playing){elapsed+=(now-last)*Number(el('speed').value);draw()}last=now;requestAnimationFrame(tick)}reset();requestAnimationFrame(tick);
</script></html>
