<!doctype html><meta charset="utf-8"><title>04 山岳守卫 · 受击检查</title><style>body{margin:24px;font:16px system-ui;background:#20272b;color:#eee}button,select{font:inherit;padding:8px;margin-right:8px}#stage{width:min(80vw,650px);aspect-ratio:1;background:repeating-conic-gradient(#ddd 0 25%,#f0f0f0 0 50%) 0/32px 32px;position:relative}img{width:100%;height:100%;object-fit:contain}#status{padding:12px 0}p{max-width:800px}</style><h1>04 山岳守卫 · 受击</h1><p>原样画布播放，每帧 40ms，每段 240ms；慢速每帧 160ms。未调整脚底或包围盒。此页供动态与逐帧检查，素材未接客户端。</p><select id="dir"><option>E</option><option>W</option></select><select id="speed"><option value="40">正常 40ms</option><option value="160">慢速 160ms</option></select><button id="play">播放/暂停</button><button id="prev">上一帧</button><button id="next">下一帧</button><button id="restart">从头播放一遍</button><div id="status"></div><div id="stage"><img id="sprite"></div><script>const files={"E": ["frames/hit/E/frame_01.png", "frames/hit/E/frame_02.png", "frames/hit/E/frame_03.png", "frames/hit/E/frame_04.png", "frames/hit/E/frame_05.png", "frames/hit/E/frame_06.png"], "W": ["frames/hit/W/frame_01.png", "frames/hit/W/frame_02.png", "frames/hit/W/frame_03.png", "frames/hit/W/frame_04.png", "frames/hit/W/frame_05.png", "frames/hit/W/frame_06.png"]};let index=0,playing=false,timer=null;const dir=document.querySelector('#dir'),speed=document.querySelector('#speed'),img=document.querySelector('#sprite'),status=document.querySelector('#status');function show(){const a=files[dir.value]||[];if(!a.length){status.textContent='该方向未齐';return}img.src='../../'+a[index];status.textContent=dir.value+' 第 '+(index+1)+' / '+a.length+' 帧 · '+speed.value+'ms/帧'}function stop(){playing=false;clearInterval(timer)}function start(loop=true){stop();playing=true;timer=setInterval(()=>{const a=files[dir.value]||[];if(index===a.length-1&&!loop){stop();return}index=(index+1)%a.length;show()},Number(speed.value))}document.querySelector('#play').onclick=()=>playing?stop():start();document.querySelector('#prev').onclick=()=>{stop();index=(index+5)%6;show()};document.querySelector('#next').onclick=()=>{stop();index=(index+1)%6;show()};document.querySelector('#restart').onclick=()=>{index=0;show();start(false)};dir.onchange=()=>{stop();index=0;show()};speed.onchange=()=>{if(playing)start();show()};show();</script>
