<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>雷法少年东北向跑步16帧动态复审</title><style>body{font:16px system-ui;background:#1d3035;color:#fff4d7;margin:16px}button,input{font:inherit;padding:8px;margin:4px}#stage{width:560px;height:560px;position:relative;background:repeating-conic-gradient(#4a5b5d 0 25%,#34494c 0 50%) 0/32px 32px}#stage:after{content:"";position:absolute;top:92%;left:0;right:0;border-top:1px dashed #ffe098}#im{width:100%;height:100%}.strip{display:grid;grid-template-columns:repeat(8,140px);gap:6px}.strip img{width:140px;display:block}.strip div{background:#2b4146;text-align:center}p{max-width:1150px}</style><h2>06 雷法少年 · NE 跑步16帧 · 待动态验收</h2><p>16张独立原生帧，各原生全画布降采样。当前统一1200ms/圈，每帧75ms；另有慢放、暂停与逐帧。虚线是共同地面试线，未逐帧贴鞋底。逐图靴轴已局部修正；03白绑腿异常拉长已收短，保留鞋轴与抬跟。全组相位、首尾连续性和客户端滑步仍待复核。</p><p><a style="color:#f4d58b" href="../preview/timing-grounding-20261003/index.html">1200ms正式节奏预览</a></p><p><a style="color:#f4d58b" href="NE03_final_correction_20261004.json">03局部修正记录与当前SHA</a></p><div id="stage"><img id="im" src="../runtime/run/NE/00.png"></div><p id="status"></p><button id="normal">正常75ms · 1200ms/圈</button><button id="slow">慢速180ms</button><button id="stop">暂停</button><button id="prev">上一帧</button><button id="next">下一帧</button><input id="seek" type="range" min="0" max="15" value="0"><div class="strip"><div><img src="../runtime/run/NE/00.png"><span>00</span></div><div><img src="../runtime/run/NE/01.png"><span>01</span></div><div><img src="../runtime/run/NE/02.png"><span>02</span></div><div><img src="../runtime/run/NE/03.png"><span>03</span></div><div><img src="../runtime/run/NE/04.png"><span>04</span></div><div><img src="../runtime/run/NE/05.png"><span>05</span></div><div><img src="../runtime/run/NE/06.png"><span>06</span></div><div><img src="../runtime/run/NE/07.png"><span>07</span></div><div><img src="../runtime/run/NE/08.png"><span>08</span></div><div><img src="../runtime/run/NE/09.png"><span>09</span></div><div><img src="../runtime/run/NE/10.png"><span>10</span></div><div><img src="../runtime/run/NE/11.png"><span>11</span></div><div><img src="../runtime/run/NE/12.png"><span>12</span></div><div><img src="../runtime/run/NE/13.png"><span>13</span></div><div><img src="../runtime/run/NE/14.png"><span>14</span></div><div><img src="../runtime/run/NE/15.png"><span>15</span></div></div><script>window.runReview={frame:0,ms:180,play:false,sequence:Array.from({length:16},(_,i)=>String(i).padStart(2,"0"))};const s=window.runReview,im=document.querySelector("#im"),label=document.querySelector("#status"),seek=document.querySelector("#seek");s.sequence.forEach(n=>{const p=new Image;p.src="../runtime/run/NE/"+n+".png"});function draw(){im.src="../runtime/run/NE/"+s.sequence[s.frame]+".png";label.textContent="NE / "+s.sequence[s.frame]+"　"+(s.play?"播放中 "+s.ms+"ms":"暂停")+"　待动态验收";seek.value=s.frame}document.querySelector("#normal").onclick=()=>{s.ms=75;s.play=true};document.querySelector("#slow").onclick=()=>{s.ms=180;s.play=true};document.querySelector("#stop").onclick=()=>{s.play=false;draw()};document.querySelector("#prev").onclick=()=>{s.play=false;s.frame=(s.frame+15)%16;draw()};document.querySelector("#next").onclick=()=>{s.play=false;s.frame=(s.frame+1)%16;draw()};seek.oninput=()=>{s.play=false;s.frame=+seek.value;draw()};let last=0;function tick(t){if(s.play&&t-last>=s.ms){s.frame=(s.frame+1)%16;last=t;draw()}requestAnimationFrame(tick)}draw();requestAnimationFrame(tick);</script></html>
