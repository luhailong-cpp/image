<!doctype html><html lang="zh"><meta charset="utf-8"><title>02 NE 连续支撑候选复核</title><style>body{background:#273340;color:white;font:16px sans-serif}img{width:512px;height:512px;object-fit:contain;background:#273340}button,select{font:inherit;margin:8px;padding:6px}small{display:block}</style><h1>NE 连续支撑候选</h1><p>16×75ms=1200ms。右16→07，左08→15。实际观感待复核，非客户端验收。</p><button id="play">暂停</button><button id="prev">上一帧</button><button id="next">下一帧</button><select id="speed"><option value="75">正常 1200ms</option><option value="300">慢放 4800ms</option></select><output id="label"></output><div><img id="sprite"><img src="eight-support-contact.jpg" style="height:auto;width:640px"></div><small>整画布等比显示，无逐帧贴地或bbox缩放。</small><script>let f=0,run=true,last=performance.now();const im=document.querySelector('#sprite'),lab=document.querySelector('#label'),speed=document.querySelector('#speed');const src=Array.from({length:16},(_,i)=>'eight-support-selected-'+String(i+1).padStart(2,'0')+'.png');src.forEach(s=>{let q=new Image;q.src=s});function show(){im.src=src[f];lab.value='帧 '+(f+1)+' / 16'}function tick(t){if(run&&t-last>=Number(speed.value)){f=(f+1)%16;last=t;show()}requestAnimationFrame(tick)}document.querySelector('#play').onclick=()=>{run=!run;document.querySelector('#play').textContent=run?'暂停':'播放';last=performance.now()};document.querySelector('#prev').onclick=()=>{run=false;f=(f+15)%16;show()};document.querySelector('#next').onclick=()=>{run=false;f=(f+1)%16;show()};show();requestAnimationFrame(tick)</script></html>
