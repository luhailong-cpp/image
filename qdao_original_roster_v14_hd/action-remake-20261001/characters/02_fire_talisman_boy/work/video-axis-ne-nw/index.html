<!doctype html><meta charset="utf-8"><title>02 NE/NW 视频脚轴复核</title><style>body{background:#243440;color:#fff;font:16px system-ui;padding:20px}main{display:flex;gap:24px}img{width:384px;height:384px;background:#e5e1d3}button,select,input{margin:6px;padding:6px}section{text-align:center}</style><h1>02 NE / NW · 视频脚轴修订</h1><p>每帧75ms，整圈1200ms；慢放4800ms。正式1024原图，无逐帧贴地。</p><button id="play">暂停</button><select id="speed"><option value="75">正常1200ms</option><option value="300">慢放4800ms</option></select><input id="frame" type="range" min="1" max="16" value="1"><span id="label"></span><main><section>NE<br><img id="NE"></section><section>NW<br><img id="NW"></section></main><script>let f=0,run=true,start=performance.now(),ms=75;const imgs={};for(const d of ['NE','NW'])imgs[d]=Array.from({length:16},(_,i)=>{let x=new Image();x.src='../../frames/run/'+d+'/'+String(i+1).padStart(2,'0')+'.png?v=videoaxis';return x});function show(){for(const d of ['NE','NW'])document.getElementById(d).src=imgs[d][f].src;frame.value=f+1;label.textContent='第'+(f+1)+'帧'}play.onclick=()=>{run=!run;play.textContent=run?'暂停':'播放';start=performance.now()-f*ms};speed.onchange=()=>{ms=Number(speed.value);start=performance.now()-f*ms};frame.oninput=()=>{run=false;play.textContent='播放';f=Number(frame.value)-1;show()};function tick(t){if(run){let n=Math.floor((t-start)/ms)%16;if(n!==f){f=n;show()}}requestAnimationFrame(tick)}show();requestAnimationFrame(tick)</script>
