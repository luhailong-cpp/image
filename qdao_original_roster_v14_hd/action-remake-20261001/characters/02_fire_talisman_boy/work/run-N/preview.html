=1;id('heading').textContent='run / '+data.direction+' · '+Object.keys(data.available).length+'/16';function show(n){slot=n;const f=data.available[n];id('slider').value=n;id('image').style.visibility=f?'visible':'hidden';id('empty').style.display=f?'none':'grid';if(f)id('image').src=f.src;else id('image').removeAttribute('src');id('state').textContent='槽位 '+n+'/16 · 缺失 '+data.missing.join(', ');id('detail').textContent=JSON.stringify(f||{missing:true},null,2)}function stop(){clearTimeout(timer);timer=null}function tick(){show(slot%16+1);timer=setTimeout(tick,data.frameMs*factor)}function play(f){stop();factor=f;timer=setTimeout(tick,data.frameMs*factor)}function step(d){stop();show((slot+d+15)%16+1)}show(1);</script></html>
