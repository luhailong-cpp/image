<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>02 火符少年 · 跑步动态检查</title>
<style>body{font:16px system-ui;margin:24px;background:#172023;color:#e5eded}button,select,input{font:inherit;margin:6px;padding:6px}main{display:flex;gap:24px;flex-wrap:wrap}.pane{background:#283435;padding:16px;border-radius:12px}.stage{position:relative;background:repeating-conic-gradient(#263b3c 0% 25%,#2c4243 0% 50%) 0/24px 24px}.stage img{width:100%;height:100%;object-fit:contain}.floor{position:absolute;top:91.9921875%;height:1px;background:#e6ca6a;width:100%}.root{position:absolute;left:50%;top:91.9921875%;width:6px;height:6px;background:#e6ca6a;transform:translate(-50%,-50%)}#small{width:128px;height:128px}#large{width:512px;height:512px}p{max-width:1000px;line-height:1.65}#status{color:#f0d386}code{font-size:13px}</style>
<h1>02 火符少年 · 跑步候选检查</h1><p id="status">正在读取本角色清单。候选预览不代表客户端已接入。</p>
<label>方向<select id="dir"></select></label><button id="play">播放</button><button id="prev">上一帧</button><button id="next">下一帧</button>
<label>速度<select id="speed"><option value="30">正常 · 30ms/帧 · 480ms/圈</option><option value="120">慢速 · 120ms/帧</option></select></label>
<label>游戏尺寸取样<select id="size"><option>64</option><option>96</option><option selected>128</option><option>160</option><option>192</option></select>px</label>
<p id="label"></p><input id="frame" type="range" min="1" max="16" value="1" style="width:480px">
<main><div class="pane"><p>小尺寸取样（实际游戏受相机与窗口分辨率影响）</p><div class="stage" id="small"><img><i class="floor"></i><i class="root"></i></div></div>
<div class="pane"><p>放大 / 逐帧</p><div class="stage" id="large"><img><i class="floor"></i><i class="root"></i></div></div></main>
<p>黄线＝固定虚拟地面 y=942，黄点＝角色根点 (512,942)。腾空帧的脚应高于黄线，不能把脚拉回地面。逐方向检查右手持符、左手提铃，肩肘腕连接和腿臂反相、支撑压低/蹬地/腾空/异侧落地、16→01接缝以及体型光照一致。</p>
<pre id="detail"></pre>
<script>
let manifest,rows=[],index=0,playing=false,last=0;
const el=id=>document.getElementById(id), dirs=['N','NE','E','SE','S','SW','W','NW'];
function show(){const r=rows[index];el('frame').value=r?r.frame:1;el('label').textContent=r?el('dir').value+'/'+String(r.frame).padStart(2,'0')+' · '+rows.length+'/16 个实际候选':'该方向尚无候选';document.querySelectorAll('.stage img').forEach(im=>{im.hidden=!r;if(r)im.src='../'+r.file;});el('detail').textContent=r?JSON.stringify({sha256:r.sha256,native:[r.nativeWidth,r.nativeHeight],visualStatus:r.visualStatus,source:r.source},null,2):''}
function select(){playing=false;el('play').textContent='播放';rows=manifest.frames.filter(r=>r.direction===el('dir').value).sort((a,b)=>a.frame-b.frame);index=0;el('play').disabled=rows.length!==16;show()}
el('play').onclick=()=>{playing=!playing;el('play').textContent=playing?'暂停':'播放';last=performance.now()};
el('prev').onclick=()=>{playing=false;index=(index-1+rows.length)%rows.length;show()};
el('next').onclick=()=>{playing=false;index=(index+1)%rows.length;show()};
el('frame').oninput=()=>{playing=false;const n=rows.findIndex(r=>r.frame===Number(el('frame').value));if(n>=0)index=n;show()};
el('dir').onchange=select;el('size').onchange=()=>{el('small').style.width=el('small').style.height=el('size').value+'px'};
function tick(t){if(playing&&rows.length===16){const dt=Number(el('speed').value);if(t-last>=dt){const steps=Math.floor((t-last)/dt);index=(index+steps)%16;last+=steps*dt;show()}}requestAnimationFrame(tick)}
fetch('../manifest.json').then(r=>r.json()).then(m=>{manifest=m;dirs.forEach(d=>{const o=document.createElement('option');o.textContent=d;o.value=d;el('dir').append(o)});el('dir').value='E';el('status').textContent='实际导出 '+m.exportedFrameCount+'/128；美术验收以 review.json 为准。未接入客户端 / 未运行验收。缺帧方向禁止自动连播。';select();requestAnimationFrame(tick)}).catch(e=>el('status').textContent='请通过本角色本地 HTTP 预览启动；清单读取失败：'+e.message);
</script></html>
