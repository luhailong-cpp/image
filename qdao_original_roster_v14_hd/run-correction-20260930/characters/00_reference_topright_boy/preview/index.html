<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>00 金发带Q道童 · 跑步验收</title>
<style>body{margin:24px;background:#253035;color:#eee;font:16px system-ui}button,select,input{font:inherit;margin:6px;padding:5px}canvas{background:#454f53;border:1px solid #73878b;max-width:95vw}a{color:#dfc47b}.row{display:flex;flex-wrap:wrap;gap:24px;align-items:end}.note{color:#ddd;max-width:1000px}</style>
<h1>00 金发带Q道童 · 跑步验收</h1><p class="note">仅本角色候选预览。128 帧齐全、播放器运行、来源检查均不能代替美术验收。正常循环为 16 × 30ms = 480ms。未接入客户端。</p>
<label>方向 <select id="direction"></select></label><label>速度 <select id="speed"><option value="30">正常 30ms/帧</option><option value="120">慢速 120ms/帧</option><option value="240">逐帧观察 240ms/帧</option></select></label>
<button id="toggle">暂停</button><button id="prev">上一帧</button><button id="next">下一帧</button>
<label>背景 <select id="bg"><option value="#454f53">灰</option><option value="#fff">白</option><option value="#000">黑</option></select></label>
<label><input type="checkbox" id="ground" checked>虚拟地面</label><p id="state">读取帧清单…</p>
<div class="row"><div>小尺寸可读性代理（96px 画布；实际引擎尺寸待核）<br><canvas id="small" width="96" height="96"></canvas></div><div>放大审阅（512px 画布）<br><canvas id="large" width="512" height="512"></canvas></div></div>
<p id="phase"></p><input id="scrub" type="range" min="1" max="16" value="1"><p><a href="../candidate-inventory.json">文件与 SHA 清单</a> · <a href="../review.json">验收记录</a> · <a href="../CLIENT_HANDOFF.md">独立接入交接</a></p>
<script>
const phases=['右脚落地','右腿吸收冲击','右支撑最低点','右蹬地','离地','腾空换腿','左脚前送','左脚预落地','左脚落地','左腿吸收冲击','左支撑最低点','左蹬地','离地','腾空换腿','右脚前送','右脚预落地'];
let frames=[],dir='E',index=0,running=true,last=0,images={},draws=0;
const el=x=>document.getElementById(x);
function render(){const f=frames.find(x=>x.direction===dir&&x.frame===index+1); for(const id of ['small','large']){const c=el(id),g=c.getContext('2d');g.fillStyle=el('bg').value;g.fillRect(0,0,c.width,c.height);if(f&&images[f.path])g.drawImage(images[f.path],0,0,c.width,c.height);if(el('ground').checked){g.strokeStyle='#e5ad45';g.setLineDash([3,3]);g.beginPath();g.moveTo(0,c.height*942/1024);g.lineTo(c.width,c.height*942/1024);g.stroke();}}el('state').textContent=dir+' / '+String(index+1).padStart(2,'0')+'/16 · '+(running?'播放中':'已暂停')+' · '+(f?'候选':'缺帧')+' · '+frames.filter(x=>x.direction===dir).length+'/16 张 · '+el('speed').value+'ms/帧';el('phase').textContent='计划相位：'+phases[index]+'（实际是否符合以目视验收为准）';el('scrub').value=index+1;document.body.dataset.frame=index+1;document.body.dataset.direction=dir;draws++;}
function tick(t){if(running&&t-last>=+el('speed').value){let steps=Math.floor((t-last)/+el('speed').value);index=(index+steps)%16;last=t;render();}requestAnimationFrame(tick)}
el('toggle').onclick=()=>{running=!running;el('toggle').textContent=running?'暂停':'播放';last=performance.now();render()};
el('prev').onclick=()=>{running=false;index=(index+15)%16;el('toggle').textContent='播放';render()};
el('next').onclick=()=>{running=false;index=(index+1)%16;el('toggle').textContent='播放';render()};
el('scrub').oninput=()=>{running=false;index=+el('scrub').value-1;el('toggle').textContent='播放';render()};
el('direction').onchange=()=>{dir=el('direction').value;index=0;render()};
el('bg').onchange=render;el('ground').onchange=render;
fetch('frames.json').then(x=>x.json()).then(async data=>{frames=data.frames;for(const d of ['N','NE','E','SE','S','SW','W','NW']){const opt=document.createElement('option');opt.value=opt.textContent=d;el('direction').append(opt)}el('direction').value='E';await Promise.all(frames.map(f=>new Promise(resolve=>{const im=new Image;im.onload=()=>{images[f.path]=im;resolve()};im.onerror=resolve;im.src=f.path})));render();last=performance.now();requestAnimationFrame(tick)}).catch(e=>el('state').textContent='读取失败：'+e);
</script></html>
