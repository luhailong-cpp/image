<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>09 竹弓少女 · 八方向移动审阅</title>
<style>body{margin:0;background:#182328;color:#f1eddc;font:16px system-ui}header{padding:20px 28px;background:#263b3d;position:sticky;top:0;z-index:2}h1{font-size:23px;margin:0 0 10px}p{margin:8px 0}button,select,input{font:inherit;margin:4px;padding:7px}button{cursor:pointer}#grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:16px}.card{border:1px solid #637575;border-radius:8px;padding:8px}.card img{width:100%;display:block;cursor:zoom-in}.stage{background:#1a2428}.light .stage{background:#efece0}.card footer{display:flex;justify-content:space-between}a{color:#baddbd}#detail{max-width:none;width:min(95vw,1300px);background:#182328;color:white;border:1px solid #637575}#detail img{display:block;max-width:none;width:1024px;height:1024px;margin:auto}.close{float:right}.info{padding:0 28px 20px}#detailScroll{overflow:auto;max-height:80vh}.status{color:#edcda0}@media(max-width:900px){#grid{grid-template-columns:repeat(2,minmax(0,1fr))}}</style>
<header><h1>09 竹弓少女 · 8 向移动素材审阅</h1><p id="inventory"></p><button id="play">暂停</button><button id="prev">上一帧</button><button id="next">下一帧</button><label>模式 <select id="mode"><option value="walk">行走循环</option><option value="idle">独立站立</option><option value="seam">首尾 15 → 16 → 01 → 02</option></select></label><label>背景 <select id="bg"><option value="dark">深色</option><option value="light">浅色</option></select></label><label>帧 <input id="slider" type="range" min="1" max="16" value="1"></label><b id="frame"></b><p class="status">固定 30 毫秒/帧 · 16 帧/圈 · 480 毫秒/圈。点击人物按原始 1024 尺寸放大检查。离线素材审阅，未执行 Unity 或正式客户端验收。</p></header>
<main id="grid"></main><section class="info"><p>逐方向联系表和 GIF：</p><div id="links"></div><p><a href="manifest.json">逐文件 SHA、真实来源与数字检查</a> · <a href="preview/idle-light.png">八向站立浅底</a> · <a href="preview/idle-dark.png">八向站立深底</a></p><p id="qa">美术审阅状态：pending。文件数量与数字检查不代表步态、比例、边缘及循环已通过。</p></section>
<dialog id="detail"><button class="close" onclick="this.closest('dialog').close()">关闭</button><h2 id="detailTitle"></h2><div id="detailScroll" class="stage"><img id="detailImage"></div></dialog>
<script>
const manifest=__MANIFEST__,dirs=['N','NE','E','SE','S','SW','W','NW'],known=new Set(manifest.files.map(f=>f.key));let frame=1,playing=false,last=performance.now(),elapsed=0,mode='walk',detailDirection=null;const imgs={},preloaded=[];document.querySelector('#play').disabled=true;document.querySelector('#play').textContent='载入图片';
document.querySelector('#inventory').textContent=`本快照：${manifest.walkCount}/128 行走，${manifest.idleCount}/8 独立站立；每张 1024×1024 透明 PNG。`;
for(const d of dirs){const card=document.createElement('article');card.className='card';card.innerHTML=`<div class="stage"><img alt="${d} 方向"></div><footer><b>${d}</b><span></span></footer>`;imgs[d]=card.querySelector('img');imgs[d].onclick=()=>{detailDirection=d;document.querySelector('#detailTitle').textContent=d+' · 原尺寸1024';document.querySelector('#detail').showModal();render()};document.querySelector('#grid').append(card);const line=document.createElement('p');line.innerHTML=d+'：'+['dark','light'].map(bg=>`<a href="preview/${d}-${bg}-contact.png">${bg==='dark'?'深':'浅'}底16帧</a> · <a href="preview/${d}-${bg}-30ms.gif">30ms GIF</a> · <a href="preview/${d}-${bg}-seam.png">首尾接缝</a>`).join(' ｜ ');document.querySelector('#links').append(line)}
function key(d){return mode==='idle'?`idle/${d}.png`:`walk/${d}/${String(frame).padStart(2,'0')}.png`}
function render(){document.querySelector('#frame').textContent=mode==='idle'?'站立':`${String(frame).padStart(2,'0')} / 16`;document.querySelector('#slider').value=frame;for(const d of dirs){const k=key(d);const img=imgs[d];if(known.has(k)){const src='runtime/'+k;if(img.getAttribute('src')!==src)img.src=src;img.style.visibility='visible'}else img.style.visibility='hidden';img.closest('article').querySelector('span').textContent=known.has(k)?(mode==='idle'?'独立站立':String(frame).padStart(2,'0')):'缺帧';}if(detailDirection&&document.querySelector('#detail').open){document.querySelector('#detailImage').src=imgs[detailDirection].src;document.querySelector('#detailTitle').textContent=detailDirection+' · '+(mode==='idle'?'站立':frame)+' · 1024原尺寸'}}
function step(delta){playing=false;document.querySelector('#play').textContent='播放';frame=(frame-1+delta+16)%16+1;render()}
document.querySelector('#play').onclick=()=>{playing=!playing;last=performance.now();elapsed=0;document.querySelector('#play').textContent=playing?'暂停':'播放'};document.querySelector('#prev').onclick=()=>step(-1);document.querySelector('#next').onclick=()=>step(1);document.querySelector('#slider').oninput=e=>{playing=false;document.querySelector('#play').textContent='播放';frame=+e.target.value;render()};document.querySelector('#mode').onchange=e=>{mode=e.target.value;frame=mode==='seam'?15:1;elapsed=0;render()};document.querySelector('#bg').onchange=e=>document.body.classList.toggle('light',e.target.value==='light');
function tick(now){elapsed+=now-last;last=now;if(playing&&mode!=='idle'&&elapsed>=30){const n=Math.floor(elapsed/30);elapsed%=30;if(mode==='seam'){const seq=[15,16,1,2];frame=seq[(seq.indexOf(frame)+n)%4]}else frame=(frame-1+n)%16+1;render()}requestAnimationFrame(tick)}render();requestAnimationFrame(tick);
Promise.all(manifest.files.map(f=>new Promise((resolve,reject)=>{const im=new Image();preloaded.push(im);im.onload=()=>resolve(f.key);im.onerror=()=>reject(f.key);im.src='runtime/'+f.key}))).then(()=>{playing=true;last=performance.now();elapsed=0;document.querySelector('#play').disabled=false;document.querySelector('#play').textContent='暂停'}).catch(key=>{document.querySelector('#qa').textContent='图片载入失败：'+key;document.querySelector('#play').textContent='载入失败'});
</script></html>
