<!doctype html><html lang="zh"><meta charset="utf-8"><title>07 W/SW 30ms 待审预览</title><style>body{font:16px sans-serif;background:#ccd0d4;margin:16px}header{position:sticky;top:0;padding:10px;background:#fff;z-index:1}button,select{font:inherit;margin:4px;padding:7px}.pair{display:flex;gap:12px;align-items:flex-start}.panel{padding:10px}canvas{width:512px;height:512px;display:block}.dark{background:#1e262e;color:white}.light{background:#f0eee4;color:#121820}body.zoom canvas{width:1024px;height:1024px}small{display:block}</style><header><b>07 月影少女｜W/SW 候选待验收</b><select id="direction"><option>W</option><option>SW</option></select><button id="play">暂停</button><button id="prev">上一帧</button><button id="next">下一帧</button><button id="zoom">1024原尺寸</button><label>帧 <input id="frame" type="range" min="1" max="16" value="1"><span id="counter"></span></label><small>30毫秒/帧 · 480毫秒/圈 · 实际候选文件直接加载；帧数不代表验收通过</small></header><div class="pair"><div class="panel dark">深底<canvas id="dark" width="1024" height="1024"></canvas></div><div class="panel light">浅底<canvas id="light" width="1024" height="1024"></canvas></div></div><script>
const images={}; let dir='W',running=true,index=0,start=performance.now(),loaded=0; const cs=[...document.querySelectorAll('canvas')]; const frame=document.querySelector('#frame'),counter=document.querySelector('#counter');
for(const d of ['W','SW']){images[d]=[];for(let i=1;i<=16;i++){let im=new Image; im.src='../candidate/07_moon_shadow_assassin_girl/walk/'+d+'/'+String(i).padStart(2,'0')+'.png';im.onload=()=>{loaded++;draw()};images[d].push(im)}}
function draw(){cs.forEach((c,i)=>{const x=c.getContext('2d');x.fillStyle=i?'#f0eee4':'#1e262e';x.fillRect(0,0,1024,1024);const im=images[dir]?.[index];if(im?.complete&&im.naturalWidth)x.drawImage(im,0,0);x.strokeStyle=i?'#77858a':'#71828b';x.beginPath();x.moveTo(0,943);x.lineTo(1024,943);x.stroke()});frame.value=index+1;counter.textContent=dir+String(index+1).padStart(2,'0')+' / 16 · 已载入 '+loaded+'/32'}
function tick(t){if(running){const n=Math.floor((t-start)/30)%16;if(n!==index){index=n;draw()}}requestAnimationFrame(tick)}
document.querySelector('#play').onclick=()=>{running=!running;start=performance.now()-index*30;document.querySelector('#play').textContent=running?'暂停':'播放'};
document.querySelector('#prev').onclick=()=>{running=false;index=(index+15)%16;document.querySelector('#play').textContent='播放';draw()};
document.querySelector('#next').onclick=()=>{running=false;index=(index+1)%16;document.querySelector('#play').textContent='播放';draw()};
frame.oninput=()=>{running=false;index=+frame.value-1;document.querySelector('#play').textContent='播放';draw()};
document.querySelector('#direction').onchange=e=>{dir=e.target.value;start=performance.now();index=0;draw()};
document.querySelector('#zoom').onclick=()=>{document.body.classList.toggle('zoom');document.querySelector('#zoom').textContent=document.body.classList.contains('zoom')?'512显示':'1024原尺寸'};
draw();requestAnimationFrame(tick);
</script></html>
