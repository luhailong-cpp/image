<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>07 月影少女 · 八方向审阅</title>
<style>body{font:16px system-ui;background:#eee9df;color:#193c43;margin:24px}h1{font-size:26px}button,select{padding:8px;margin:4px;font:inherit}canvas{width:512px;height:512px;background:#20262e}#stage{overflow:auto;max-height:1080px}#timeline{max-width:1050px}#timeline .active{background:#176763;color:white}#seam{display:flex;gap:12px;overflow:auto}#seam img{width:256px;background:#20262e}pre{white-space:pre-wrap}.warn{color:#93412e}a{color:#176763}</style>
<h1>07 月影少女 · 八方向角色移动图</h1><p class="warn" id="summary"></p><p>30毫秒/帧、480毫秒/圈。缺帧明确留空，无插值或替代帧。离线视觉复核待记录；未作Unity/正式客户端验收。</p>
<select id="direction"></select><select id="action"><option value="idle">独立站立</option><option value="walk">行走</option></select><button id="play">播放</button><button id="prev">上一帧</button><button id="next">下一帧</button><select id="speed"><option value="30">30 ms</option><option value="120">120 ms 慢看</option></select><select id="bg"><option value="#20262e">深底</option><option value="#f0eee4">浅底</option></select><select id="size"><option value="512">正常 512</option><option value="1024">放大 1024</option></select><div id="stage"><canvas id="canvas" width="1024" height="1024"></canvas></div><div id="timeline"></div><pre id="info"></pre><p>首尾15 → 16 → 01 → 02</p><div id="seam"></div><p id="links"></p>
<script>
const manifest=__MANIFEST__,rows=Object.fromEntries(manifest.files.map(r=>[r.path,r])),ims={},el=id=>document.getElementById(id),ctx=el('canvas').getContext('2d');let frame=1,playing=false,origin=0,startFrame=1;el('summary').textContent=`${manifest.revision} · ${manifest.walkCount}/128行走 + ${manifest.idleCount}/8独立站立 · ${manifest.missing.length}缺槽 · 待美术验收`;
for(const [d,r] of Object.entries(manifest.directions)){let o=document.createElement('option');o.value=d;o.textContent=`${d} ${r.walk}/16 ${r.idle?'站立齐':'缺站立'}`;el('direction').append(o)}
for(const r of manifest.files){let im=new Image();im.src='runtime/'+r.path;ims[r.path]=im;im.onload=draw}
const buttons=[];for(let n=1;n<=16;n++){let b=document.createElement('button');b.textContent=String(n).padStart(2,'0');b.onclick=()=>{pause();frame=n;draw()};el('timeline').append(b);buttons.push(b)}
function key(n=frame){return el('action').value==='idle'?`idle/${el('direction').value}.png`:`walk/${el('direction').value}/${String(n).padStart(2,'0')}.png`}
function pause(){playing=false;el('play').textContent='播放'}
function draw(){ctx.clearRect(0,0,1024,1024);let k=key(),im=ims[k],r=rows[k];if(im?.complete&&im.naturalWidth)ctx.drawImage(im,0,0);else{ctx.fillStyle='#cc764c';ctx.font='bold 38px system-ui';ctx.fillText('缺槽 / 无替代帧',300,512)}el('info').textContent=r?`${k} · ${r.attempt} · ${r.status}\nSHA256 ${r.sha256}\nNative ${r.nativeSize.join('×')} → 1024×1024\nactualModel ${r.actualModel??'未披露'} / actualQuality ${r.actualQuality??'未披露'}`:`${k} 缺少真实独立素材`;buttons.forEach((b,i)=>{b.className=i+1===frame?'active':'';b.style.opacity=rows[`walk/${el('direction').value}/${String(i+1).padStart(2,'0')}.png`]?'1':'.4'})}
function refresh(){pause();frame=1;el('seam').replaceChildren();for(const n of [15,16,1,2]){let box=document.createElement('div'),label=document.createElement('p');label.textContent=el('direction').value+String(n).padStart(2,'0');box.append(label);let k=`walk/${el('direction').value}/${String(n).padStart(2,'0')}.png`;if(rows[k]){let im=new Image();im.src='runtime/'+k;im.style.background=el('bg').value;box.append(im)}else box.append('缺槽');el('seam').append(box)}let d=el('direction').value;el('links').innerHTML=`<a href="preview/${d}-contact-dark.png">深底16帧</a> · <a href="preview/${d}-contact-light.png">浅底16帧</a> · <a href="preview/${d}-seam-light.png">首尾接缝</a> · <a href="preview/idle-contact-light.png">8向站立总览</a>`+(manifest.directions[d].complete?` · <a href="preview/${d}-30ms-dark.gif">深底30ms GIF</a> · <a href="preview/${d}-30ms-light.gif">浅底30ms GIF</a>`:' · 方向缺帧，未生成完整GIF');draw()}
el('direction').onchange=refresh;el('action').onchange=()=>{pause();draw()};el('play').onclick=()=>{if(el('action').value==='idle')return;if(playing){pause();return}playing=true;origin=performance.now();startFrame=frame;el('play').textContent='暂停'};el('prev').onclick=()=>{pause();frame=(frame+14)%16+1;draw()};el('next').onclick=()=>{pause();frame=frame%16+1;draw()};el('speed').onchange=()=>{origin=performance.now();startFrame=frame};el('bg').onchange=e=>{el('canvas').style.background=e.target.value;el('seam').querySelectorAll('img').forEach(i=>i.style.background=e.target.value)};el('size').onchange=e=>{el('canvas').style.width=e.target.value+'px';el('canvas').style.height=e.target.value+'px'};function tick(t){if(playing){let next=(startFrame-1+Math.floor((t-origin)/+el('speed').value))%16+1;if(next!==frame){frame=next;draw()}}requestAnimationFrame(tick)}refresh();requestAnimationFrame(tick);
</script></html>
