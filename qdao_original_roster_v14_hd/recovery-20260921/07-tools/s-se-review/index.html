<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>07 S/SE 30ms 离线复核</title><style>body{font:18px system-ui;background:#ece9df;color:#213b45;margin:16px}button,select{font:inherit;padding:8px;margin:6px}#stage{overflow:auto;max-height:1150px}canvas{background:#20262e}#row{display:flex;gap:8px}#row img{width:240px}#info{font:16px monospace}</style><h1>07 S/SE 独立行走 — 30ms / 480ms</h1><p>离线素材检查；客户端未接入</p><select id="dir"><option>S</option><option>SE</option><option>NW</option></select><button id="play">暂停</button><select id="bg"><option value="#20262e">深底</option><option value="#f0eee4">浅底</option></select><select id="size"><option value="512">正常512</option><option value="1024">放大1024</option></select><select id="speed"><option value="30">30毫秒</option><option value="120">120毫秒慢看</option></select><button id="prev">上一帧</button><button id="next">下一帧</button><div id="info"></div><div id="stage"><canvas id="c" width="1024" height="1024" style="width:512px;height:512px"></canvas></div><div id="timeline"></div><h3>15 → 16 → 01 → 02</h3><div id="row"></div><script>const el=id=>document.getElementById(id),ctx=el('c').getContext('2d'),ims={};let direction='S',frame=1,playing=true,start=performance.now(),offset=0;const base='../candidate/07_moon_shadow_assassin_girl/walk/';for(const d of ['S','SE','NW'])for(let n=1;n<=16;n++){let im=new Image();im.src=base+d+'/'+String(n).padStart(2,'0')+'.png?review=20260928';ims[d+n]=im}function draw(){ctx.clearRect(0,0,1024,1024);const im=ims[direction+frame];if(im?.complete)ctx.drawImage(im,0,0);el('info').textContent=direction+' '+String(frame).padStart(2,'0')+' / 16 · '+(playing?'播放中':'已暂停')+' · '+el('speed').value+'ms'}function seam(){el('row').replaceChildren();for(const n of [15,16,1,2]){let b=document.createElement('div');b.textContent=direction+String(n).padStart(2,'0');let im=new Image();im.src=ims[direction+n].src;im.style.background=el('bg').value;b.append(im);el('row').append(b)}}for(let n=1;n<=16;n++){let b=document.createElement('button');b.textContent=String(n).padStart(2,'0');b.onclick=()=>{playing=false;el('play').textContent='播放';frame=n;draw()};el('timeline').append(b)}el('dir').onchange=()=>{direction=el('dir').value;start=performance.now();offset=0;frame=1;draw();seam()};el('bg').onchange=()=>{el('c').style.background=el('bg').value;seam()};el('size').onchange=()=>{el('c').style.width=el('size').value+'px';el('c').style.height=el('size').value+'px'};el('play').onclick=()=>{playing=!playing;offset=frame-1;start=performance.now();el('play').textContent=playing?'暂停':'播放';draw()};el('prev').onclick=()=>{playing=false;el('play').textContent='播放';frame=(frame+14)%16+1;draw()};el('next').onclick=()=>{playing=false;el('play').textContent='播放';frame=frame%16+1;draw()};el('speed').onchange=()=>{offset=frame-1;start=performance.now()};function tick(t){if(playing){frame=(offset+Math.floor((t-start)/+el('speed').value))%16+1;draw()}requestAnimationFrame(tick)}seam();requestAnimationFrame(tick);</script></html>
