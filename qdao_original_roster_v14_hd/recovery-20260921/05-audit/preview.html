<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>05 天音少女 NE 动作审查</title><style>body{background:#f6f1e5;color:#18333c;font:16px/1.6 sans-serif;margin:24px}button{font:inherit;padding:8px 16px;margin:6px;background:#e4efec;border:1px solid #a0b2a7}canvas{width:min(60vw,512px);background:#202b38}.row{display:flex;gap:22px;align-items:start}#idle{width:300px}#timeline{max-width:900px}h1{font-size:24px}img{max-width:100%}</style><h1>05 天音少女 · NE 16 帧校阅</h1><p>30 毫秒 / 帧，480 毫秒循环。旧图 512 与新图 1024 按同世界尺寸显示；原文件保持不动。</p><button id="play">播放 / 暂停</button><button id="prev">上一帧</button><button id="next">下一帧</button><button id="background">白色 / 深色背景</button><strong id="label"></strong><div class="row"><canvas id="walk" width="1024" height="1024"></canvas><div>独立站立图<br><canvas id="idle" width="1024" height="1024"></canvas></div></div><div id="timeline"></div><p>视觉结论见 NE-VISUAL-REVIEW.md；本页不批准素材。</p><h2>15 → 16 → 01</h2><img src="NE-seam-15-16-01-dark.png"><script>const data={"frames": ["../../../qdao_original_roster_v13/candidate/05_celestial_musician_girl/walk/NE/01.png", "../../../qdao_original_roster_v14_hd/candidate/05_celestial_musician_girl/walk/NE/02.png", "../../../qdao_original_roster_v14_hd/candidate/05_celestial_musician_girl/walk/NE/03.png", "../../../qdao_original_roster_v14_hd/candidate/05_celestial_musician_girl/walk/NE/04.png", "../../../qdao_original_roster_v13/candidate/05_celestial_musician_girl/walk/NE/05.png", "../../../qdao_original_roster_v14_hd/candidate/05_celestial_musician_girl/walk/NE/06.png", "../../../qdao_original_roster_v14_hd/candidate/05_celestial_musician_girl/walk/NE/07.png", "../../../qdao_original_roster_v14_hd/candidate/05_celestial_musician_girl/walk/NE/08.png", "../../../qdao_original_roster_v13/candidate/05_celestial_musician_girl/walk/NE/09.png", "../../../qdao_original_roster_v14_hd/candidate/05_celestial_musician_girl/walk/NE/10.png", "../../../qdao_original_roster_v14_hd/candidate/05_celestial_musician_girl/walk/NE/11.png", "../../../qdao_original_roster_v14_hd/candidate/05_celestial_musician_girl/walk/NE/12.png", "../../../qdao_original_roster_v13/candidate/05_celestial_musician_girl/walk/NE/13.png", "../../../qdao_original_roster_v14_hd/candidate/05_celestial_musician_girl/walk/NE/14.png", "../../../qdao_original_roster_v14_hd/candidate/05_celestial_musician_girl/walk/NE/15.png", "../../../qdao_original_roster_v14_hd/candidate/05_celestial_musician_girl/walk/NE/16.png"], "idle": "../../../qdao_original_roster_v13/candidate/05_celestial_musician_girl/idle/NE.png"};const walk=document.querySelector('#walk'),label=document.querySelector('#label');let phase=0,playing=false,last=performance.now(),white=false;const imgs=data.frames.map(p=>{let im=new Image;im.src=p;return im});function paint(){let n=Math.floor(phase/30)%16;let c=walk.getContext('2d');c.clearRect(0,0,1024,1024);if(imgs[n].complete)c.drawImage(imgs[n],0,0,1024,1024);label.textContent=` NE${String(n+1).padStart(2,'0')} · ${[1,5,9,13].includes(n+1)?'旧512':'新1024'}`;}const idle=new Image;idle.onload=()=>document.querySelector('#idle').getContext('2d').drawImage(idle,0,0,1024,1024);idle.src=data.idle;imgs.forEach(im=>im.onload=paint);document.querySelector('#play').onclick=()=>{playing=!playing;last=performance.now()};function frame(n){playing=false;phase=((n+16)%16)*30;paint()}document.querySelector('#prev').onclick=()=>frame(Math.floor(phase/30)-1);document.querySelector('#next').onclick=()=>frame(Math.floor(phase/30)+1);document.querySelector('#background').onclick=()=>{white=!white;document.querySelectorAll('canvas').forEach(c=>c.style.background=white?'white':'#202b38')};for(let n=0;n<16;n++){let b=document.createElement('button');b.textContent=String(n+1).padStart(2,'0');b.onclick=()=>frame(n);document.querySelector('#timeline').append(b)}function tick(t){if(playing){phase=(phase+t-last)%480;paint()}last=t;requestAnimationFrame(tick)}requestAnimationFrame(tick);</script></html>
