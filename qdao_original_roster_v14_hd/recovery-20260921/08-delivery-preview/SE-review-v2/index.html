function draw(){for(const[d,c,cap]of panels){paint(c,slot(d,frame));cap.textContent=`${d} · ${action==='idle'?'独立站立':String(frame).padStart(2,'0')}`};paint($('large'),slot(direction,frame));$('detailTitle').textContent=`${direction} · ${action==='idle'?'独立站立':'行走 '+String(frame).padStart(2,'0')}`;$('frame').value=frame;$('number').textContent=String(frame).padStart(2,'0')}
function drawSeams(){$('seams').replaceChildren();for(const f of[15,16,1,2]){const box=document.createElement('div'),label=document.createElement('div'),c=document.createElement('canvas');c.width=c.height=512;label.textContent=`${direction} ${String(f).padStart(2,'0')}`;box.append(label,c);$('seams').append(box);paint(c,slot(direction,f,'walk'))}}
function pause(){playing=false;$('play').textContent='播放'}
function step(n){pause();frame=(frame-1+n+16)%16+1;draw()}
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'暂停':'播放';const at=sequence.indexOf(frame);start=performance.now()-Math.max(0,at)*30};
$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('frame').oninput=()=>{pause();frame=+$('frame').value;draw()};
$('direction').onchange=()=>{direction=$('direction').value;draw();drawSeams()};$('action').onchange=()=>{action=$('action').value;draw()};$('theme').onchange=()=>{draw();drawSeams()};
$('zoom').onclick=()=>{$('detail').classList.toggle('zoom');$('zoom').textContent=$('detail').classList.contains('zoom')?'正常 512 显示':'放大 1:1'};
function mode(seq){sequence=seq;start=performance.now();frame=sequence[0];last=-1;playing=true;$('play').textContent='暂停';action='walk';$('action').value='walk';draw()}
$('seam').onclick=()=>mode([15,16,1,2]);$('cycle').onclick=()=>mode(Array.from({length:16},(_,i)=>i+1));
function tick(now){if(playing&&action==='walk'){const at=Math.floor((now-start)/30)%sequence.length;if(at!==last){last=at;frame=sequence[at];draw()}}requestAnimationFrame(tick)}
draw();drawSeams();requestAnimationFrame(tick);
</script></html>
