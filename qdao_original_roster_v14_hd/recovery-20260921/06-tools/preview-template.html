<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>06 雷法少年八方向独立审计预览</title><style>body{font:16px system-ui;margin:24px;background:#eee9dc;color:#173833}h1{font-size:26px}button,select{font:inherit;padding:8px;margin:5px}canvas{background:#20262e;width:512px;height:512px;max-width:95vw}#stage{overflow:auto;max-width:100%;max-height:1100px}#timeline{max-width:1000px}#timeline button.active{background:#175d57;color:white}.warn{color:#9a4229}pre{white-space:pre-wrap;max-width:1200px}#seam{display:flex;overflow:auto;gap:12px}#seam img{width:256px;background:#20262e}</style>
<h1>06 雷法少年 · 八方向混合素材</h1><p id="summary" class="warn"></p><p id="known-issues" class="warn"></p><p>原512与新1024素材均保持原字节，预览按相同世界尺寸显示；30ms/帧、480ms/圈，无插值、镜像、复制补帧。此包没有正式批准或客户端接入声明。</p>
<script>addEventListener('DOMContentLoaded',()=>{document.getElementById('known-issues').textContent=Object.entries(manifest.review_notes||{}).map(([slot,note])=>slot+'：'+note).join(' ');});</script>
<select id="direction"></select><select id="action"><option value="walk">行走</option><option value="idle">独立站立</option></select><button id="play">播放</button><button id="prev">上一帧</button><button id="next">下一帧</button><select id="speed"><option value="30">30 ms / 帧</option><option value="120">120 ms / 帧慢看</option></select><select id="bg"><option value="#20262e">深底</option><option value="#f0eee4">浅底</option></select><select id="size"><option value="512">正常 512 显示</option><option value="1024">放大 1024 世界像素</option></select><div id="stage"><canvas width="1024" height="1024" id="canvas"></canvas></div><div id="timeline"></div><pre id="info"></pre><p>首尾15 → 16 → 01 → 02（缺槽不会复用相邻帧）：</p><div id="seam"></div><p id="links"></p>
<script>const manifest=__MANIFEST__,rows=Object.fromEntries(manifest.files.map(r=>[r.path,r])),ims={},canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),play=document.getElementById('play'),direction=document.getElementById('direction'),action=document.getElementById('action'),speed=document.getElementById('speed'),info=document.getElementById('info');let frame=1,playing=false,last=0,elapsed=0;document.getElementById('summary').textContent=`快照 ${manifest.revision} · ${manifest.actual_walk}/128行走 + ${manifest.actual_idle}/8站立 · 未正式批准 · 浏览器动态验收未记录`;for(const d of Object.keys(manifest.directions)){let o=document.createElement('option');o.value=d;o.textContent=`${d} (${manifest.directions[d].available_walk}/16)`;direction.appendChild(o)}for(const r of manifest.files){const im=new Image();im.src='runtime/'+r.path;im.onload=()=>{if(key()===r.path)draw()};ims[r.path]=im}const buttons=[];for(let i=1;i<=16;i++){let b=document.createElement('button');b.textContent=String(i).padStart(2,'0');b.onclick=()=>{frame=i;playing=false;play.textContent='播放';draw()};document.getElementById('timeline').appendChild(b);buttons.push(b)}function key(){return action.value==='idle'?`idle/${direction.value}.png`:`walk/${direction.value}/${String(frame).padStart(2,'0')}.png`}function draw(){ctx.clearRect(0,0,1024,1024);const k=key(),r=rows[k],im=ims[k];if(im?.complete&&im.naturalWidth)ctx.drawImage(im,0,0,1024,1024);else{ctx.font='bold 36px system-ui';ctx.fillStyle='#bb7443';ctx.fillText('缺槽 / 无替代帧',300,500)}info.textContent=r?`${k} | ${r.size.join('×')} | ${r.selected_revision} | ${r.visual_status}\nSHA256: ${r.sha256}\n来源: ${r.source}`:`${k} 缺少真实素材`;buttons.forEach((b,i)=>{b.className=i+1===frame?'active':'';const p=`walk/${direction.value}/${String(i+1).padStart(2,'0')}.png`;b.style.opacity=rows[p]?'1':'.4'})}function refreshDirection(){frame=1;playing=false;play.textContent='播放';const seam=document.getElementById('seam');seam.replaceChildren();for(const n of [15,16,1,2]){let box=document.createElement('div'),label=document.createElement('div');label.textContent=direction.value+String(n).padStart(2,'0');box.appendChild(label);let k=`walk/${direction.value}/${String(n).padStart(2,'0')}.png`;if(rows[k]){let im=document.createElement('img');im.src='runtime/'+k;im.alt=label.textContent;box.appendChild(im)}else box.append('缺槽');seam.appendChild(box)}const d=direction.value;document.getElementById('links').innerHTML=`<a href="preview/${d}-contact-dark.png">深底16帧总览</a> · <a href="preview/${d}-contact-light.png">浅底总览</a> · <a href="preview/${d}-seam15-16-01-02-light.png">浅底接缝</a>`+(manifest.directions[d].complete_inventory?` · <a href="preview/${d}-30ms-dark.gif">深底30ms GIF</a> · <a href="preview/${d}-30ms-light.gif">浅底30ms GIF</a>`:' · 当前方向缺帧，不生成完整GIF');draw()}play.onclick=()=>{if(action.value==='idle')return;playing=!playing;play.textContent=playing?'暂停':'播放';elapsed=0};document.getElementById('prev').onclick=()=>{frame=(frame+14)%16+1;draw()};document.getElementById('next').onclick=()=>{frame=frame%16+1;draw()};direction.onchange=refreshDirection;action.onchange=()=>{playing=false;play.textContent='播放';draw()};document.getElementById('bg').onchange=e=>{canvas.style.background=e.target.value;document.querySelectorAll('#seam img').forEach(i=>i.style.background=e.target.value)};document.getElementById('size').onchange=e=>{canvas.style.width=e.target.value+'px';canvas.style.height=e.target.value+'px'};function tick(t){if(last&&playing){elapsed+=t-last;let ms=+speed.value;if(elapsed>=ms){let count=Math.floor(elapsed/ms);frame=(frame-1+count)%16+1;elapsed-=count*ms;draw()}}last=t;requestAnimationFrame(tick)}refreshDirection();requestAnimationFrame(tick);</script></html>
