<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>07 月影少女 · 六段战斗动作连播</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#141321;color:#efedf7}body{max-width:1420px;margin:28px auto;padding:0 24px}h1{font-size:26px;margin-bottom:8px}.intro{color:#b5b0c9;line-height:1.6}button,select{font:inherit;border:1px solid #605773;border-radius:7px;background:#2c2740;color:inherit;padding:8px 13px;margin:5px 5px 5px 0;cursor:pointer}.controls{margin:18px 0}button.active{background:#6b4b9b}.stages{display:grid;grid-template-columns:1fr 1fr;gap:20px}.stage{border:1px solid #72667c;border-radius:12px;overflow:hidden}.light{background:#f3efe7;color:#37313e}.dark{background:#11101b;color:#ccc3e2}.stage .label{padding:12px 18px;font-size:13px}.canvas{position:relative;aspect-ratio:1;line-height:0}.canvas img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.guide{position:absolute;pointer-events:none;inset:0;background:linear-gradient(90deg,transparent calc(50% - .5px),#b989c970 50%,transparent calc(50% + .5px))}.guide:after{content:"";position:absolute;bottom:8%;left:0;right:0;border-top:1px dashed #b989c980}.status{padding:12px 0;font-variant-numeric:tabular-nums;color:#d6c3f5}.scrub{width:100%;margin:12px 0}.segments{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.segments button{margin:0;font-size:13px}.note{font-size:13px;color:#b5b0c9;line-height:1.6}.metrics{white-space:pre-wrap;font-size:12px;color:#b5b0c9}label{margin-right:16px}@media(max-width:800px){.stages{grid-template-columns:1fr}.segments{grid-template-columns:repeat(3,1fr)}}
</style>
<h1>07 月影少女 · 战斗动作连播</h1>
<p class="intro">深浅底同步检查。受击 6 帧 × 40ms，普通攻击 12 帧 × 30ms，施法 16 帧 × 45ms。下方播放计数仅记录页面播放，不代表美术验收通过。</p>
<div class="controls"><button id="play">播放</button><button id="pause">暂停</button><button id="previous">上一帧</button><button id="next">下一帧</button>
<select id="speed" aria-label="播放倍率"><option value="1">正常速度 1×</option><option value="0.25">慢放 0.25×（4 倍时长）</option></select>
<label><input type="checkbox" id="continuous" checked>六段顺序连播，每段循环 3 次</label>
<label><input type="checkbox" id="guides">显示固定画布参考线</label></div>
<div class="segments" id="segments"></div><div class="status" id="status">正在预载图片…</div>
<div class="stages"><div class="stage light"><div class="label">浅底 #f3efe7</div><div class="canvas"><img id="lightImage" alt="月影少女战斗动作浅底"><div class="guide" hidden></div></div></div><div class="stage dark"><div class="label">深底 #11101b</div><div class="canvas"><img id="darkImage" alt="月影少女战斗动作深底"><div class="guide" hidden></div></div></div></div>
<input class="scrub" type="range" id="scrub" min="0" value="0" aria-label="逐帧查看">
<p class="note">观察：发饰在解剖左侧、恰好两把弯月匕首且各手一把、头身与武器尺寸稳定、衣服图案不闪变、全程脚根/重心合理、起止衔接自然、边缘无黑白底杂边。参考线是固定画布坐标，不会逐帧调整图片。视觉审核与客户端接入/运行验收分别记录。</p>
<details><summary>当前页面播放记录（不构成验收结论）</summary><pre class="metrics" id="metrics"></pre></details>
<script>
const sets=__SETS__;
const names={hit:'受击',attack:'普通攻击',cast:'施法'};
const $=id=>document.getElementById(id);
let selected=0,index=0,playing=false,start=0,lastCycle=0,loaded=false,raf=null;
const playback={normal:{},slow:{},loadedImages:0,loadErrors:[],reviewStatus:'pending',clientIntegration:'not_integrated',runtimeAcceptance:'not_tested'};
const cache=[];
function render(){const set=sets[selected];index=Math.max(0,Math.min(index,set.images.length-1));$('lightImage').src=set.images[index];$('darkImage').src=set.images[index];$('scrub').max=set.images.length-1;$('scrub').value=index;const speed=+$('speed').value;$('status').textContent=`${names[set.action]} / ${set.direction} · ${String(index+1).padStart(2,'0')} / ${set.images.length} 帧 · ${speed===1?'正常速度 1×':'慢放 0.25×'} · 实际目标 ${set.ms/speed}ms/帧 · 单段 ${set.images.length*set.ms/speed}ms · ${playing?'播放中':'暂停'}${loaded?'':' · 预载中'}`;document.querySelectorAll('[data-set]').forEach(b=>b.classList.toggle('active',+b.dataset.set===selected));$('metrics').textContent=JSON.stringify(playback,null,2);}
function pause(){playing=false;cancelAnimationFrame(raf);render()}
function choose(number){pause();selected=number;index=0;render()}
sets.forEach((set,i)=>{const button=document.createElement('button');button.dataset.set=i;button.textContent=`${names[set.action]} / ${set.direction}`;button.onclick=()=>choose(i);$('segments').append(button)});
function tick(timestamp){if(!playing)return;const set=sets[selected],frameMs=set.ms/+$('speed').value;const elapsed=timestamp-start;const absoluteFrame=Math.floor(elapsed/frameMs);const cycle=Math.floor(absoluteFrame/set.images.length);if(cycle>lastCycle){const mode=+$('speed').value===1?'normal':'slow';const key=set.action+'/'+set.direction;playback[mode][key]=(playback[mode][key]||0)+(cycle-lastCycle);lastCycle=cycle;if($('continuous').checked&&cycle>=3){selected=(selected+1)%sets.length;index=0;lastCycle=0;start=timestamp;render();raf=requestAnimationFrame(tick);return}}index=absoluteFrame%set.images.length;render();raf=requestAnimationFrame(tick)}
function play(){if(!loaded)return;pause();playing=true;lastCycle=0;start=performance.now()-index*sets[selected].ms/+$('speed').value;render();raf=requestAnimationFrame(tick)}
$('play').onclick=play;$('pause').onclick=pause;$('previous').onclick=()=>{pause();index=(index-1+sets[selected].images.length)%sets[selected].images.length;render()};$('next').onclick=()=>{pause();index=(index+1)%sets[selected].images.length;render()};$('scrub').oninput=()=>{pause();index=+$('scrub').value;render()};$('speed').onchange=()=>{const was=playing;pause();index=0;if(was)play();else render()};$('guides').onchange=()=>document.querySelectorAll('.guide').forEach(g=>g.hidden=!$('guides').checked);
Promise.all(sets.flatMap(s=>s.images).map(src=>new Promise(resolve=>{const img=new Image();cache.push(img);img.onload=()=>{playback.loadedImages++;resolve()};img.onerror=()=>{playback.loadErrors.push(src);resolve()};img.src=src}))).then(()=>{loaded=playback.loadErrors.length===0;render()});render();
window.combat07Playback=playback;
</script></html>
