<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>06 雷法少年 · 六段动作审阅</title>
<style>
*{box-sizing:border-box}body{font:16px system-ui,sans-serif;background:#192329;color:#eee;margin:24px}h1{font-size:25px}
button,select{font:inherit;padding:7px 11px;margin:3px;border-radius:5px}button{cursor:pointer}.controls{max-width:1080px}
.stages{display:flex;gap:16px;flex-wrap:wrap}.stage{width:min(44vw,512px);height:min(44vw,512px);position:relative}
.stage img{width:100%;height:100%;object-fit:contain}.dark{background:#101216}.light{background:#fafafa}
.checker{background-color:#ddd;background-image:linear-gradient(45deg,#aaa 25%,transparent 25%),linear-gradient(-45deg,#aaa 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#aaa 75%),linear-gradient(-45deg,transparent 75%,#aaa 75%);background-size:32px 32px;background-position:0 0,0 16px,16px -16px,-16px 0}
.stage small{position:absolute;top:6px;left:8px;color:#999}#status{min-height:3em;font-variant-numeric:tabular-nums}.muted{color:#bac4ca}#timeline{width:min(96%,1040px)}
</style>
<h1>06 雷法少年 · 六段战斗动作</h1>
<p class="muted">离线图片审阅。技术检查与视觉验收分别记录；客户端未接入、未运行验证。</p>
<div class="controls">
<select id="segment"><option value="all">六段连续播放（hit E/W → attack E/W → cast E/W）</option></select>
<select id="speed"><option value="1">正常 1×</option><option value="0.5">慢放 0.5×（2 倍时长）</option><option value="0.25">慢放 0.25×（4 倍时长）</option></select>
<button id="play">播放</button><button id="pause">暂停</button><button id="restart">从头播放</button>
<label><input type="checkbox" id="loop" checked>循环</label><br>
<button id="prev">上一帧</button><button id="next">下一帧</button><button id="checker">右侧切换棋盘底</button>
<input id="timeline" type="range" min="0" value="0" step="1">
</div>
<p id="status">正在预载 PNG…</p>
<div class="stages"><div class="stage dark"><small>深色底</small><img id="dark" alt="动作帧"></div><div id="right-stage" class="stage light"><small id="right-label">浅色底</small><img id="light" alt="动作帧"></div></div>
<p id="coverage" class="muted"></p><p id="warning" class="muted"></p>
<script>
const manifest=__MANIFEST__, $=id=>document.getElementById(id);
let timeline=[], cursor=0, playing=false, baseTime=0, elapsed=0, raf=0, ready=false, lastDraw=-1, completedCycles=0;
manifest.sets.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=s.name+' · '+s.frames.length+'/'+s.expected+' · '+s.ms+'ms/帧';$('segment').append(o)});
function build(){let t=0;timeline=[];const selected=$('segment').value;manifest.sets.forEach((s,i)=>{if(selected!=='all'&&+selected!==i)return;s.frames.forEach(f=>{timeline.push({...f,segment:s.name,ms:s.ms,start:t,end:t+s.ms});t+=s.ms})});$('timeline').max=Math.max(0,timeline.length-1);cursor=0;elapsed=0;lastDraw=-1;draw()}
function draw(){if(!timeline.length){$('status').textContent='没有可播放的成品帧';return}cursor=Math.max(0,Math.min(cursor,timeline.length-1));const f=timeline[cursor];if(lastDraw!==cursor){$('dark').src=f.url;$('light').src=f.url;lastDraw=cursor}$('timeline').value=cursor;const speed=+$('speed').value;$('status').textContent=f.segment+' · 帧 '+String(f.number).padStart(2,'0')+' · '+speed+'× · 正常 '+f.ms+'ms/帧 · 当前 '+(f.ms/speed)+'ms/帧 · 序列 '+(cursor+1)+'/'+timeline.length+(playing?' · 播放中':' · 已暂停');$('coverage').textContent='本页完整循环次数：'+completedCycles+'。播放次数仅是浏览状态，不等于视觉验收。'}
function stop(){if(playing)elapsed+=(performance.now()-baseTime)*(+$('speed').value);playing=false;cancelAnimationFrame(raf);draw()}
function tick(now){if(!playing||!timeline.length)return;const total=timeline[timeline.length-1].end;let current=elapsed+(now-baseTime)*(+$('speed').value);if(current>=total){if(!$('loop').checked){elapsed=total;playing=false;cursor=timeline.length-1;completedCycles++;draw();return}const cycles=Math.floor(current/total);completedCycles+=cycles;current%=total;elapsed=current;baseTime=now;}cursor=timeline.findIndex(f=>f.end>current);if(cursor<0)cursor=timeline.length-1;draw();raf=requestAnimationFrame(tick)}
function play(){if(!ready||!timeline.length)return;if(playing)return;const total=timeline[timeline.length-1].end;if(elapsed>=total)elapsed=0;baseTime=performance.now();playing=true;raf=requestAnimationFrame(tick)}
function seek(n){stop();cursor=Math.max(0,Math.min(n,timeline.length-1));elapsed=timeline[cursor]?.start||0;draw()}
$('play').onclick=play;$('pause').onclick=stop;$('restart').onclick=()=>{stop();seek(0);play()};$('prev').onclick=()=>seek(cursor-1);$('next').onclick=()=>seek(cursor+1);$('timeline').oninput=()=>seek(+$('timeline').value);
$('segment').onchange=()=>{stop();build()};$('speed').onchange=()=>{playing=false;cancelAnimationFrame(raf);elapsed=timeline[cursor]?.start||0;draw()};
$('checker').onclick=()=>{const check=$('right-stage').classList.toggle('checker');$('right-stage').classList.toggle('light',!check);$('right-label').textContent=check?'棋盘底':'浅色底'};
const incomplete=manifest.sets.filter(s=>!s.complete).map(s=>s.name);$('warning').textContent='技术状态：'+manifest.technicalStatus+'；视觉状态：pending。'+(incomplete.length?'未齐全段：'+incomplete.join('、'):'68 张完整；仍须实际逐段审阅动作和边缘。');
build();Promise.all(manifest.sets.flatMap(s=>s.frames).map(f=>new Promise((resolve,reject)=>{const i=new Image();i.onload=resolve;i.onerror=()=>reject(new Error(f.url));i.src=f.url}))).then(()=>{ready=true;draw()}).catch(e=>{$('status').textContent='PNG 预载失败：'+e.message});
window.reviewPlayer={manifest,getState:()=>({cursor,playing,completedCycles,segment:$('segment').value,speed:+$('speed').value}),play,stop,seek};
</script></html>
