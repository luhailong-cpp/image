<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>V14 战斗动作 · 离线预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ee;color:#292c30;font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1160px;margin:28px auto;padding:0 20px}h1{font-size:26px;margin:0}p{margin:7px 0 18px}.badge{display:inline-block;padding:3px 10px;background:#fff0cc;border-radius:6px;color:#714f0a}.layout{display:grid;grid-template-columns:minmax(300px,620px) 1fr;gap:24px}.stage{position:relative;width:100%;aspect-ratio:1;background-color:#dad8d3;background-image:linear-gradient(45deg,#c9c7c1 25%,transparent 25%),linear-gradient(-45deg,#c9c7c1 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#c9c7c1 75%),linear-gradient(-45deg,transparent 75%,#c9c7c1 75%);background-size:32px 32px;background-position:0 0,0 16px,16px -16px,-16px 0;border:1px solid #c3c1bb;border-radius:12px;overflow:hidden}.stage.dark{background-color:#353a43;background-image:linear-gradient(45deg,#292e35 25%,transparent 25%),linear-gradient(-45deg,#292e35 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#292e35 75%),linear-gradient(-45deg,transparent 75%,#292e35 75%)}.stage img{width:100%;height:100%;object-fit:contain;display:block}.empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:#4d5055;padding:30px;background:#e5e3dda8}.dark .empty{background:#303740a8;color:#fff}.panel{background:white;padding:20px;border:1px solid #dedbd3;border-radius:12px;min-width:0}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0}label{display:block}button,select{font:inherit;border:1px solid #c8c7c2;background:#fff;border-radius:6px;padding:7px 10px;cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #30778b;outline-offset:2px}button.primary{background:#276a70;color:#fff;border-color:#276a70}input[type=range]{width:100%;accent-color:#276a70}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;background:#f7f6f2;padding:12px;border-radius:6px}small{color:#666}#frameInfo{font-variant-numeric:tabular-nums}.issues{color:#9b442d}.good{color:#276a70}.legend{color:#696b6e;font-size:13px}details{margin:20px 0}a{color:#286d78}@media(max-width:800px){.layout{grid-template-columns:1fr}main{margin-top:16px}}
</style>
<main>
<h1>V14 战斗动作 · 离线预览</h1>
<p><span class="badge">待逐帧美术验收 · 未接入客户端</span></p>
<p id="summary"></p>
<div class="layout">
<section>
<div class="stage" id="stage"><img id="sprite" alt="当前动作帧"><div class="empty" id="empty">尚无图片</div></div>
<div class="controls"><button id="play" class="primary">播放一次</button><button id="previous" aria-label="上一帧">上一帧</button><button id="next" aria-label="下一帧">下一帧</button><button id="background">深色背景</button></div>
<label for="scrub" id="frameInfo">帧</label><input id="scrub" type="range" min="1" max="6" value="1">
<p class="legend">动作默认只播放一次，结束停在最后一帧。浏览器定时仅供离线观察，游戏命中与释放事件尚未配置。</p>
</section>
<aside class="panel">
<div class="controls"><label>角色 <select id="character" aria-label="角色"></select></label><label>动作 <select id="action" aria-label="动作"><option value="hit">受击 · 6 帧</option><option value="attack">普通攻击 · 12 帧</option><option value="cast">施法 · 16 帧</option></select></label><label>方向 <select id="direction" aria-label="方向"><option>E</option><option>W</option></select></label></div>
<p id="timing"></p><p id="state" aria-live="polite"></p>
<pre id="metadata"></pre>
<p class="legend">完全重复像素会报错；像素不同不能证明姿态真实不同、左右持武器正确或动作连贯，仍需人工逐帧检查。</p>
<p><a href="manifest.json">查看技术清单 JSON</a></p>
</aside>
</div>
<details><summary>全局检查问题</summary><pre id="globalIssues"></pre></details>
</main>
<script id="manifest" type="application/json">__MANIFEST_JSON__</script>
<script>
"use strict";
const manifest=JSON.parse(document.getElementById("manifest").textContent);
const el=id=>document.getElementById(id);
const labels={hit:"受击",attack:"普通攻击",cast:"施法"};
const summary=manifest.summary;
el("summary").textContent=`本次清单 ${summary.present} / ${summary.expected} 张；缺失 ${summary.missing} 张；有检查问题 ${summary.frames_with_issues} 张；重复组 ${summary.duplicate_groups}。状态：离线待验收。`;
el("globalIssues").textContent=JSON.stringify({issues:manifest.issues,duplicate_groups:manifest.duplicate_groups},null,2);
for(const id of manifest.characters){const option=document.createElement("option");option.value=id;option.textContent=id;el("character").append(option);}
let frames=[],position=0,playing=false,start=0,raf=0;
function stop(){playing=false;cancelAnimationFrame(raf);el("play").textContent="播放一次";}
function show(index){
 position=Math.max(0,Math.min(index,frames.length-1));const frame=frames[position];if(!frame)return;
 el("scrub").value=position+1;el("frameInfo").textContent=`${labels[frame.action]} · ${frame.direction} · 第 ${position+1} / ${frames.length} 帧`;
 el("empty").hidden=frame.exists;el("empty").style.display=frame.exists?"none":"grid";
 el("sprite").style.visibility=frame.exists?"visible":"hidden";
 if(frame.exists){el("sprite").src=frame.url;el("sprite").alt=`角色 ${frame.character} ${labels[frame.action]} ${frame.direction} 第 ${frame.number} 帧`;}
 else{el("sprite").removeAttribute("src");el("empty").textContent=`缺少第 ${frame.number} 帧\n${frame.path}`;}
 el("state").className=frame.issues.length?"issues":"good";el("state").textContent=frame.issues.length?`检查问题：${frame.issues.join("、")}`:"此帧技术检查通过，待美术验收";
 el("metadata").textContent=JSON.stringify({file:frame.path,size:frame.width?[frame.width,frame.height]:null,alpha_channel:frame.alpha_channel??null,visible_bbox:frame.visible_bbox??null,actual_model:frame.actual_model??"未确认",actual_quality:frame.actual_quality??"未确认",receipts:frame.receipt_paths,sha256:frame.sha256??null},null,2);
}
function select(){stop();frames=manifest.frames.filter(frame=>frame.character===el("character").value&&frame.action===el("action").value&&frame.direction===el("direction").value);el("scrub").max=frames.length;const action=manifest.actions[el("action").value];el("timing").textContent=`总时长 ${action.duration_ms} ms · 每帧 ${action.frame_duration_ms} ms`;show(0);}
function tick(now){if(!playing)return;const interval=manifest.actions[el("action").value].frame_duration_ms;const current=Math.floor((now-start)/interval);show(Math.min(current,frames.length-1));if(current>=frames.length){stop();return;}raf=requestAnimationFrame(tick);}
el("play").addEventListener("click",()=>{if(playing){stop();return;}show(0);playing=true;start=performance.now();el("play").textContent="暂停";raf=requestAnimationFrame(tick);});
el("previous").addEventListener("click",()=>{stop();show(position-1);});el("next").addEventListener("click",()=>{stop();show(position+1);});el("scrub").addEventListener("input",()=>{stop();show(Number(el("scrub").value)-1);});
for(const key of ["character","action","direction"])el(key).addEventListener("change",select);
el("background").addEventListener("click",()=>{const dark=el("stage").classList.toggle("dark");el("background").textContent=dark?"浅色背景":"深色背景";});
el("sprite").addEventListener("error",()=>{el("sprite").style.visibility="hidden";el("empty").style.display="grid";el("empty").textContent="图片无法读取；可能在清单生成后已移动或删除。请重新运行检查。";});
select();
</script>
</html>
