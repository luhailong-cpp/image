<script>
"use strict";
const manifest=JSON.parse(document.getElementById("manifest").textContent);
const el=id=>document.getElementById(id);
const labels={hit:"受击",attack:"普通攻击",cast:"施法"};
const summary=manifest.summary;
el("summary").textContent=`本次清单 ${summary.present} / ${summary.expected} 张；缺失 ${summary.missing} 张；有检查问题 ${summary.frames_with_issues} 张；重复组 ${summary.duplicate_groups}。状态：离线待验收。`;
el("globalIssues").textContent=JSON.stringify({issues:manifest.issues,duplicate_groups:manifest.duplicate_groups},null,2);
for(const id of manifest.characters){const option=document.createElement("option");option.value=id;option.textContent=id;el("character").append(option);}
let frames=[],position=0,playing=false,start=0,raf=0;
function stop(){playing=false;cancelAnimationFrame(raf);el("play").textContent="播放一次";}
function show(index){
 position=Math.max(0,Math.min(index,frames.length-1));const frame=frames[position];if(!frame)return;
 el("scrub").value=position+1;el("frameInfo").textContent=`${labels[frame.action]} · ${frame.direction} · 第 ${position+1} / ${frames.length} 帧`;
 el("empty").hidden=frame.exists;el("empty").style.display=frame.exists?"none":"grid";
 el("sprite").style.visibility=frame.exists?"visible":"hidden";
 if(frame.exists){el("sprite").src=frame.url;el("sprite").alt=`角色 ${frame.character} ${labels[frame.action]} ${frame.direction} 第 ${frame.number} 帧`;}
 else{el("sprite").removeAttribute("src");el("empty").textContent=`缺少第 ${frame.number} 帧\n${frame.path}`;}
 el("state").className=frame.issues.length?"issues":"good";el("state").textContent=frame.issues.length?`检查问题：${frame.issues.join("、")}`:"此帧技术检查通过，待美术验收";
 el("metadata").textContent=JSON.stringify({file:frame.path,size:frame.width?[frame.width,frame.height]:null,alpha_channel:frame.alpha_channel??null,visible_bbox:frame.visible_bbox??null,actual_model:frame.actual_model??"未确认",actual_quality:frame.actual_quality??"未确认",receipts:frame.receipt_paths,sha256:frame.sha256??null},null,2);
}
function select(){stop();frames=manifest.frames.filter(frame=>frame.character===el("character").value&&frame.action===el("action").value&&frame.direction===el("direction").value);el("scrub").max=frames.length;const action=manifest.actions[el("action").value];el("timing").textContent=`总时长 ${action.duration_ms} ms · 每帧 ${action.frame_duration_ms} ms`;show(0);}
function tick(now){if(!playing)return;const interval=manifest.actions[el("action").value].frame_duration_ms;const current=Math.floor((now-start)/interval);show(Math.min(current,frames.length-1));if(current>=frames.length){stop();return;}raf=requestAnimationFrame(tick);}
el("play").addEventListener("click",()=>{if(playing){stop();return;}show(0);playing=true;start=performance.now();el("play").textContent="暂停";raf=requestAnimationFrame(tick);});
el("previous").addEventListener("click",()=>{stop();show(position-1);});el("next").addEventListener("click",()=>{stop();show(position+1);});el("scrub").addEventListener("input",()=>{stop();show(Number(el("scrub").value)-1);});
for(const key of ["character","action","direction"])el(key).addEventListener("change",select);
el("background").addEventListener("click",()=>{const dark=el("stage").classList.toggle("dark");el("background").textContent=dark?"浅色背景":"深色背景";});
el("sprite").addEventListener("error",()=>{el("sprite").style.visibility="hidden";el("empty").style.display="grid";el("empty").textContent="图片无法读取；可能在清单生成后已移动或删除。请重新运行检查。";});
select();
</script>
