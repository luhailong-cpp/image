<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>年轻吕洞宾 · 8 / 16 帧同步审阅</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#172327;color:#e6e8de;font:16px/1.5 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1400px;margin:0 auto;padding:28px}h1{font-size:26px;margin:0 0 8px}p{color:#b9c5c3;margin:8px 0 20px}.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:14px 0;position:sticky;top:0;background:#172327ee;z-index:2}button,select{font:inherit;background:#294047;color:#fff;border:1px solid #547079;border-radius:5px;padding:8px 14px;cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #f1c77c}label{display:flex;align-items:center;gap:7px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(500px,1fr));gap:22px}.card{background:#233237;border:1px solid #42595e;border-radius:8px;padding:16px}.card h2{margin:0 0 12px;font-size:20px}.pair{display:flex;justify-content:center;gap:8px}.slot{width:50%;text-align:center}.slot strong{display:block;font-size:14px}.slot canvas{display:block;width:100%;height:auto;background:repeating-conic-gradient(#405257 0% 25%,#37494e 0% 50%) 50%/24px 24px}.state{font:13px/1.4 ui-monospace,monospace;color:#c1d7d6}.pending{color:#ffd18c}.large .grid{grid-template-columns:1fr}.large .pair{max-width:1040px;margin:auto}.large canvas{max-width:512px}.guide{color:#aebfbd;font-size:14px}#clock{font-variant-numeric:tabular-nums}.empty{color:#ffd18c}@media(max-width:560px){main{padding:15px}.grid{grid-template-columns:1fr}.card{padding:9px}.bar{gap:8px}h1{font-size:22px}button,select{padding:7px 10px}}
</style>
<main><h1>年轻吕洞宾 · 同步步态审阅</h1><p>左侧 V12 八帧，右侧 V13 十六帧；同一时间轴、相同显示比例，完整循环均为 480 毫秒。</p>
<div class="bar"><button id="play" aria-label="暂停播放">暂停</button><button id="previous">上一帧</button><button id="next">下一帧</button><label>方向<select id="direction"><option value="all">八方向</option><option>S</option><option>E</option><option>N</option><option>NE</option><option>SE</option><option>SW</option><option>W</option><option>NW</option></select></label><label>速度<select id="speed"><option value="1">正常</option><option value="0.5">半速</option><option value="0.25">四分之一</option></select></label><label><input id="idle" type="checkbox">独立站立</label><label><input id="large" type="checkbox">放大审阅</label><span id="clock"></span></div>
<p class="guide">重点观察：01 / 09 左右腿接触、15 → 16 → 01 衔接、摆臂与腿配合、器物归属、头部定位。橙色状态表示该向尚未补齐；页面不会复制旧图填满空位。</p><div class="grid" id="grid"></div></main>
<script>
const dirs=['S','E','N','NE','SE','SW','W','NW'],base='candidate/24_lu_dongbin/',loaded={},cards={};let playing=true,elapsed=0,last=performance.now(),speed=1,idle=false;
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');
async function loadImage(path){const im=new Image();im.src=path;try{await im.decode();return im}catch{return null}}
for(const d of dirs){const card=document.createElement('section');card.className='card';card.dataset.direction=d;card.innerHTML=`<h2>${d} <span class="state pending" id="state-${d}">读取 PNG…</span></h2><div class="pair"><div class="slot"><strong>V12 · 8 × 60 ms</strong><canvas width="512" height="512" aria-label="${d} V12 八帧"></canvas><span class="state old-frame"></span></div><div class="slot"><strong>V13 · 16 × 30 ms</strong><canvas width="512" height="512" aria-label="${d} V13 十六帧"></canvas><span class="state new-frame"></span></div></div>`;$('grid').append(card);cards[d]={card,canvases:[...card.querySelectorAll('canvas')],old:card.querySelector('.old-frame'),new:card.querySelector('.new-frame')};loaded[d]={frames:Array(17).fill(null),idle:null};}
async function preload(){await Promise.all(dirs.map(async d=>{const frames=await Promise.all(Array.from({length:16},(_,n)=>loadImage(`${base}walk/${d}/${pad(n+1)}.png`)));loaded[d].frames=[null,...frames];loaded[d].idle=await loadImage(`${base}idle/${d}.png`);const count=frames.filter(Boolean).length;$(`state-${d}`).textContent=`${count}/16 张已就绪`;$(`state-${d}`).classList.toggle('pending',count<16)}));draw()}
function paint(canvas,im){const ctx=canvas.getContext('2d');ctx.clearRect(0,0,512,512);if(im){ctx.drawImage(im,0,0,512,512)}else{ctx.fillStyle='#ffd18c';ctx.font=`${Math.max(22,14*512/Math.max(1,canvas.clientWidth))}px system-ui`;ctx.textAlign='center';ctx.fillText('该过渡帧待完成',256,260)}}
function draw(){const n=Math.floor(elapsed/30)%16+1,o=Math.floor(elapsed/60)%8*2+1;for(const d of dirs){const c=cards[d],l=loaded[d];paint(c.canvases[0],idle?l.idle:l.frames[o]);paint(c.canvases[1],idle?l.idle:l.frames[n]);c.old.textContent=idle?'独立 idle':`${pad((o+1)/2)} / 08`;c.new.textContent=idle?'同一原始 idle':`${pad(n)} / 16 · ${n%2?'原 V12':'新增动作'}`} $('clock').textContent=idle?'站立':`${Math.floor(elapsed%480)} / 480 ms`}
function loop(t){if(playing)elapsed=(elapsed+(t-last)*speed)%480;last=t;draw();requestAnimationFrame(loop)}
function pause(){playing=false;$('play').textContent='播放';$('play').setAttribute('aria-label','播放动画')}
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'暂停':'播放';$('play').setAttribute('aria-label',playing?'暂停播放':'播放动画')};$('previous').onclick=()=>{pause();elapsed=(Math.floor(elapsed/30)*30+450)%480;draw()};$('next').onclick=()=>{pause();elapsed=(Math.floor(elapsed/30)*30+30)%480;draw()};$('speed').onchange=e=>speed=Number(e.target.value);$('idle').onchange=e=>{idle=e.target.checked;draw()};$('large').onchange=e=>document.body.classList.toggle('large',e.target.checked);$('direction').onchange=e=>{for(const d of dirs)cards[d].card.hidden=e.target.value!=='all'&&d!==e.target.value};
window.previewDebug={getState:()=>({elapsed,frame16:Math.floor(elapsed/30)%16+1,frame8:Math.floor(elapsed/60)%8+1,playing,speed,idle,loaded:Object.fromEntries(dirs.map(d=>[d,loaded[d].frames.filter(Boolean).length]))}),setPhase:ms=>{pause();elapsed=((ms%480)+480)%480;draw()}};
preload();requestAnimationFrame(loop);
</script></html>
