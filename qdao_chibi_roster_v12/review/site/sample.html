<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>吕洞宾 · 自然走路修正样板</title>
<style>
:root{--bg:#efeee8;--panel:#fcfbf7;--ink:#263c37;--muted:#5d6e65;--line:#c4ccc3;--accent:#316556;--stage:#e8e3d9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Microsoft YaHei",sans-serif}main{max-width:1120px;margin:auto;padding:32px 24px}h1{font-size:30px;line-height:1.3;margin:14px 0 10px}h2{font-size:19px;margin:0}p{margin:8px 0;color:var(--muted)}a{color:var(--accent)}.badge{display:inline-block;padding:4px 10px;border:1px solid #b89c60;background:#f1e9d5;border-radius:4px;font-size:14px;color:#70571e}.notice{border-left:3px solid var(--accent);padding:8px 15px;margin:18px 0;background:#e0e8df}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:22px 0 14px}button,select{font:inherit;min-height:42px;padding:7px 14px;background:var(--panel);border:1px solid var(--line);border-radius:5px;color:var(--ink)}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}button:hover{border-color:var(--accent)}button[aria-pressed=true],#play{background:var(--accent);color:white}.controls label{display:flex;gap:7px;align-items:center}.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:7px;overflow:hidden}.panel header{padding:12px 18px;border-bottom:1px solid var(--line)}.panel header p{font-size:14px;margin:3px 0 0}.stage{background:var(--stage);position:relative;aspect-ratio:1;max-width:512px;margin:auto}.stage canvas{display:block;width:100%;height:100%}.guides .stage:before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1px dashed #64827466;pointer-events:none}.guides .stage:after{content:"";position:absolute;left:0;right:0;top:92.09%;border-top:1px dashed #64827466;pointer-events:none}.caption{padding:9px 18px;border-top:1px solid var(--line);font-size:14px}.timeline{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;margin:16px 0}.error{color:#9a362b;background:#f9e4df;padding:12px}[hidden]{display:none!important}footer{font-size:14px;margin-top:24px;color:var(--muted)}body[data-bg=dark]{--stage:#263737}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #448675;outline-offset:3px}@media(max-width:650px){main{padding:20px 12px}h1{font-size:25px}.pair{grid-template-columns:1fr}.timeline{gap:4px}.timeline button{padding:6px 2px}.controls{gap:7px}.panel header{padding:10px 14px}}
</style></head><body data-bg="light"><main>
<a href="index.html">← 八位角色新旧对照</a>
<h1>吕洞宾 · 自然走路修正</h1><span class="badge">仅南向 8 帧样板 · 尚未接入游戏</span>
<p class="notice">重点看三件事：道家服饰是否合意、脚步是否自然、同一循环里的脸型与大小是否稳定。</p>
<div class="controls"><button id="play" disabled>载入中</button><button id="prev" disabled>上一帧</button><button id="next" disabled>下一帧</button><label>速度<select id="speed"><option value="1">正常</option><option value="0.5">半速观察</option></select></label><button id="bg" aria-pressed="false">深底</button><label><input type="checkbox" id="guide" checked>对齐线</label></div>
<p id="error" class="error" role="alert" hidden></p>
<div class="pair guides" id="pair"><section class="panel"><header><h2>当前游戏素材</h2><p>吕洞宾 V12 · 南向 · 8 帧</p></header><div class="stage"><canvas id="old" width="512" height="512" aria-label="当前游戏吕洞宾南向走路"></canvas></div><div class="caption" id="old-caption">正在读取…</div></section><section class="panel"><header><h2>这次修正样板</h2><p>朴素道袍 · 小步行走 · 保持同一张脸</p></header><div class="stage"><canvas id="sample" width="512" height="512" aria-label="修正样板南向八帧走路"></canvas></div><div class="caption" id="sample-caption">正在读取…</div></section></div>
<div class="timeline" id="timeline" aria-label="选择帧"></div>
<p>两边使用同样的画布显示。样板的八帧均来自分别绘制的姿势；每帧 60 毫秒，一轮 480 毫秒。逐帧按钮会暂停播放。</p>
<footer>这里只核对当前这一向的造型和走路。其余七个方向、独立站立及其他角色尚未按本样板完成。<a href="sample/natural-walk-eight-light.gif">查看样板动图</a> · <a href="sample/contact-sheet.jpg">查看八帧并排</a></footer>
</main><script>
'use strict';const $=id=>document.getElementById(id);let frame=0,ready=false,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,rate=1,epoch=0;const oldFrames=[],sampleFrames=[],contexts=[$('old').getContext('2d'),$('sample').getContext('2d')];const buttons=[];
function load(src){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>im.naturalWidth===512&&im.naturalHeight===512?resolve(im):reject(new Error('画布尺寸不匹配：'+src));im.onerror=()=>reject(new Error('图片读取失败：'+src));im.src=src;});}
function paint(){if(!ready)return;contexts.forEach((ctx,i)=>{ctx.clearRect(0,0,512,512);ctx.drawImage(i?sampleFrames[frame]:oldFrames[frame],0,0);});$('old-caption').textContent='当前素材 · 第 '+(frame+1)+' / 8 帧';$('sample-caption').textContent='修正样板 · 第 '+(frame+1)+' / 8 帧';buttons.forEach((b,i)=>b.setAttribute('aria-pressed',String(i===frame)));$('play').textContent=playing?'暂停':'播放';}
function pause(){playing=false;paint();}function seek(i){pause();frame=(i+8)%8;paint();}
for(let i=0;i<8;i++){const b=document.createElement('button');b.textContent=String(i+1).padStart(2,'0');b.type='button';b.disabled=true;b.addEventListener('click',()=>seek(i));$('timeline').append(b);buttons.push(b);}
$('play').addEventListener('click',()=>{playing=!playing;epoch=performance.now()-frame*60/rate;paint();});$('prev').addEventListener('click',()=>seek(frame-1));$('next').addEventListener('click',()=>seek(frame+1));$('speed').addEventListener('change',()=>{rate=Number($('speed').value);epoch=performance.now()-frame*60/rate;});$('bg').addEventListener('click',()=>{const dark=document.body.dataset.bg!=='dark';document.body.dataset.bg=dark?'dark':'light';$('bg').textContent=dark?'浅底':'深底';$('bg').setAttribute('aria-pressed',String(dark));});$('guide').addEventListener('change',()=>{$('pair').classList.toggle('guides',$('guide').checked);});
Promise.all(Array.from({length:8},(_,i)=>{const n=String(i+1).padStart(2,'0');return Promise.all([load('assets/v12/24_lu_dongbin/walk/S/'+n+'.png'),load('sample/S-'+n+'.png')]);})).then(pairs=>{pairs.forEach(([a,b])=>{oldFrames.push(a);sampleFrames.push(b);});ready=true;epoch=performance.now();['play','prev','next'].forEach(id=>$(id).disabled=false);buttons.forEach(b=>b.disabled=false);paint();}).catch(e=>{$('error').hidden=false;$('error').textContent=e.message;$('play').textContent='读取失败';});
function animate(now){if(ready&&playing){const next=Math.floor((now-epoch)*rate/60)%8;if(next!==frame){frame=next;paint();}}requestAnimationFrame(animate);}requestAnimationFrame(animate);
</script></body></html>
